<body>
<div id=loginPage>
<div style="max-width:420px;margin:80px auto;padding:25px;background:#fff;border-radius:20px;box-shadow:0 5px 30px rgba(0,0,0,.08)">
<h1 style=color:#1d9bf0>chanpro-Post</h1>
<p>chanpro-Chat と共通アカウント</p>
<input id=loginName placeholder=ユーザー名 style="width:100%;padding:12px;margin:5px 0">
<input id=loginPassword type=password placeholder=パスワード style="width:100%;padding:12px;margin:5px 0">
<button class=primary style=width:100%;margin-top:10px onclick=login()>ログイン</button>
<button class=secondary style=width:100%;margin-top:8px onclick=createAccount()>新規アカウント作成</button>
<div id=loginError style=color:#f4212e;margin-top:10px>
</div>
</div>
</div>
<div id=app class="app hidden">
<aside class=sidebar>
<div class=logo>
<img src=https://qiita-image-store.s3.ap-northeast-1.amazonaws.com/0/4422522/6c28fb79-5ca6-4b57-afa1-9cd0bfa4aef8.png alt="">
<span>chanpro-Post</span>
</div>
<div class=nav>
<button onclick='showPage("home")'>
<img src="https://img.icons8.com/?size=96&id=TzMnSwiJW8HO&format=png" alt=ホーム> ホーム
</button>
<button onclick='showPage("search")'>
<img src="https://img.icons8.com/?size=96&id=12773&format=png" alt=検索> 検索
</button>
<button id=notificationNav class=navNotification onclick='showPage("notifications")'>
<img src="https://img.icons8.com/?size=80&id=41913&format=png" alt=通知> 通知
<span id=notificationDot class="notificationDot hidden">
</span>
</button>
<button onclick=showFollowingLatestPosts()>
<img src="https://img.icons8.com/?size=160&id=fqKHVbd4GWbD&format=png" alt=フォロー中> フォロー中
</button>
<button onclick='showPage("messages")'>
<img src="https://img.icons8.com/?size=160&id=bz2nLhYZWgCb&format=png" alt=DM> DM
</button>
<button onclick=showMyProfile()>
<img src="https://img.icons8.com/?size=96&id=IerOpHeUt2OH&format=png" alt=プロフィール> プロフィール
</button>
<button onclick=showBookmarks()>
<img src="https://img.icons8.com/?size=160&id=42404&format=png" alt=ブックマーク> ブックマーク
</button>
<button id=adminNav class=hidden onclick='showPage("admin")'>
<img src="https://img.icons8.com/?size=96&id=szJmuYXfPSIN&format=png" alt=管理> 管理
</button>
</div>
<button class=postButton onclick=openPostModal()>投稿</button>
<button class=secondary style=width:100%;margin-top:10px onclick=logout()>ログアウト</button>
</aside>
<main class=main>
<div id=homePage>
<div class=pageHeader>ホーム</div>
<div class=composer>
<textarea id=quickPostText placeholder=いまどうしてる？></textarea>
<input id=quickPostImage placeholder=画像URL（任意）>
<div class=postImageUploadRow>
<button type=button class=postImageUploadButton onclick='openPostImagePicker("quick")'>＋</button>
<input id=quickPostImageFile class=postImageFileInput type=file accept=image/jpeg,image/png,image/webp onchange='handlePostImageFile("quick",this.files[0])'>
<span id=quickPostImageStatus class=handle>
</span>
</div>
<div id=quickPostImagePreview class="postImagePreview hidden">
</div>
<div id=quickLinkPreview class=composerLinkPreviews>
</div>
<button id=quickLimitedToggle class="secondary hidden" style=margin-top:8px;width:100% onclick=toggleQuickLimited()>一般公開</button>
<div class=composerBottom>
<div class=composerTools>
<span>#ハッシュタグ対応</span>
<button type=button class=toolButton onclick='openPollComposer("quick")'>📊 アンケート</button>
</div>
<button class=primary onclick=quickPost()>投稿</button>
</div>
<div id=quickPollPreview>
</div>
</div>
<div id=homePosts>
</div>
<div id=homeLoadMore class="homeLoadMore hidden"></div>
</div>
<div id=searchPage class=hidden>
<div class=pageHeader>検索</div>
<div style=padding:15px>
<input id=searchInput class=search placeholder=ユーザー・投稿・#ハッシュタグ onkeydown='"Enter"===event.key&&searchAll(this.value)'>
</div>
<div id=searchResults>
</div>
</div>
<div id=notificationPage class=hidden>
<div class=pageHeader>通知</div>
<div id=notifications>
</div>
</div>
<div id=messagesPage class=hidden>
<div class=pageHeader>DM</div>
<div id=dmContent>
</div>
</div>
<div id=profilePage class=hidden>
</div>
<div id=bookmarksPage class=hidden>
<div class=pageHeader>ブックマーク</div>
<div id=bookmarkPosts>
</div>
</div>
<div id=detailPage class=hidden>
<div class="pageHeader detailBack">
  <button
    class="secondary"
    onclick="closePostDetail()"
    aria-label="戻る"
  >
    ←
  </button>

  <span>投稿</span>
</div>
<div id=detailContent>
</div>
</div>
<div id=adminPage class=hidden>
<div class=pageHeader>管理者</div>
<div id=adminContent>
</div>

async function afterLogin() {
  $("loginPage").classList.add("hidden");
  $("app").classList.remove("hidden");

  console.log("ログイン完了");

  // MQTT接続とSupabase読み込みを並行して開始
  const mqttPromise = (async () => {
    try {
      // MQTT接続は待つ
      await Promise.race([
        connectMQTT(),

        // MQTTがいつまでも接続できない場合に処理を止めない
        new Promise((_, reject) =>
          setTimeout(() => {
            reject(new Error("MQTT接続タイムアウト"));
          }, 5000)
        )
      ]);

      console.log("MQTT接続完了");

      // ログイン済みならユーザーチャンネルを購読
      if (mqttClient?.connected && currentUser?.id) {
        await new Promise((resolve) => {
          mqttClient.subscribe(
            mqttTopicUser(currentUser.id),
            { qos: 0 },
            (e) => {
              if (e) {
                console.error("MQTT subscribe user:", e);
              } else {
                console.log("MQTTユーザーチャンネル購読完了");
              }

              // subscribe失敗でも処理を止めない
              resolve();
            }
          );
        });
      }
    } catch (e) {
      // MQTT失敗・タイムアウトしてもログイン処理は継続
      console.error("MQTT接続失敗:", e);
    }

  /*

  await Promise.all([
    loadPointsRanking(),
    loadHome(),
    loadTrends(),

  ]);

  checkAdmin();

  $("quickLimitedToggle").classList.toggle(
    "hidden",
    !currentUser?.verified
  );
}

async function getProfileMusic(e,t){

  if(!e||!t||!t.music_id){
    throw new Error("音楽情報がありません");
  }

  const n=t.music_id;
  const i=Number(t.chunks);

  if(!Number.isInteger(i)||i<=0){
    throw new Error("音楽チャンク情報が不正です");
  }

  if(i>PROFILE_MUSIC_MAX_CHUNKS){
    throw new Error("音楽チャンク数が上限を超えています");
  }

  const o=new Array(i);
  const r=[];

  for(let t=0;t<i;t++){
    r.push({
      index:t,
      topic:getProfileMusicTopic(
        e,
        n,
        "chunk",
        t
      )
    });
  }

  return new Promise((resolve,reject)=>{

    const timeout=setTimeout(()=>{
      cleanup();
      reject(
        new Error(
          "音楽データの取得がタイムアウトしました"
        )
      );
    },30000);

    const listeners=[];

    function cleanup(){

      clearTimeout(timeout);

      for(const e of listeners){
        mqttClient.removeListener(
          "message",
          e
        );
      }

      for(const e of r){
        mqttClient.unsubscribe(
          e.topic,
          ()=>{}
        );
      }
    }

    let c=0;

    /*
     * 全チャンクを購読
     */
    for(const e of r){

      mqttClient.subscribe(
        e.topic,
        {qos:1},
        e=>{
          if(e){
            cleanup();
            reject(e);
          }
        }
      );
    }

    /*
     * MQTT受信
     */
    const messageHandler=(s,a)=>{

      const d=r.find(
        e=>e.topic===s
      );

      if(!d)return;

      try{

        const t=JSON.parse(
          a.toString()
        );

        if(
          t.type!=="profile_music_chunk"
        ){
          return;
        }

        if(t.music_id!==n){
          return;
        }

        if(t.index!==d.index){
          return;
        }

        /*
         * 同じチャンクを二重カウントしない
         */
        if(o[d.index]){
          return;
        }

        o[d.index]=t.data;
        c++;

        /*
         * 読み込み進捗
         */
        const progress=Math.round(
          (c/i)*100
        );

        const bar=
          document.getElementById(
            "profileMusicLoadProgressBar"
          );

        const text=
          document.getElementById(
            "profileMusicLoadProgressText"
          );

        if(bar){
          bar.style.width=
            `${progress}%`;
        }

        if(text){
          text.textContent=
            `${progress}%`;
        }

        /*
         * 全チャンク取得完了
         */
        if(c>=i){

          cleanup();

          /*
           * Base64 → ArrayBuffer
           */
          const buffers=o.map(
            e=>base64ToArrayBuffer(e)
          );

          /*
           * 全体サイズ
           */
          const totalSize=
            buffers.reduce(
              (e,t)=>e+t.byteLength,
              0
            );

          /*
           * 1つのUint8Arrayに結合
           */
          const result=
            new Uint8Array(
              totalSize
            );

          let offset=0;

          for(const buffer of buffers){

            result.set(
              new Uint8Array(buffer),
              offset
            );

            offset+=buffer.byteLength;
          }

          /*
           * 100%を確実に表示
           */
          if(bar){
            bar.style.width="100%";
          }

          if(text){
            text.textContent="100%";
          }

          resolve(
            result.buffer
          );
        }

      }catch(e){

        cleanup();
        reject(e);
      }
    };

    listeners.push(
      messageHandler
    );

    mqttClient.on(
      "message",
      messageHandler
    );
  });
}
async function playProfileMusic(e,t){

  try{

    if(!e||!t){
      throw new Error(
        "音楽情報がありません"
      );
    }

    /*
     * 現在再生中の音楽を停止
     */
    stopProfileMusic();

    /*
     * 読み込み開始
     *
     * showToast() が
     * メッセージ＋スライダーを表示する
     */
    showToast(
      "🎵 音楽を読み込んでいます..."
    );

    /*
     * MQTTから全チャンク取得
     */
    const n=
      await getProfileMusic(
        e,
        t
      );

    /*
     * 念のため100%表示
     */
    const bar=
      document.getElementById(
        "profileMusicLoadProgressBar"
      );

    const text=
      document.getElementById(
        "profileMusicLoadProgressText"
      );

    if(bar){
      bar.style.width="100%";
    }

    if(text){
      text.textContent="100%";
    }

    /*
     * Blob作成
     */
    const i=new Blob(
      [n],
      {
        type:
          t.mime||
          "audio/mpeg"
      }
    );

    /*
     * 古いObjectURLを破棄
     */
    if(profileMusicObjectUrl){

      URL.revokeObjectURL(
        profileMusicObjectUrl
      );

      profileMusicObjectUrl=null;
    }

    /*
     * 新しい音声を作成
     */
    profileMusicObjectUrl=
      URL.createObjectURL(i);

    profileMusicAudio=
      new Audio(
        profileMusicObjectUrl
      );

    profileMusicAudio.preload=
      "auto";

    /*
     * 再生終了
     */
    profileMusicAudio.onended=()=>{
      updateProfileMusicPlayButtons(
        false
      );
    };

    /*
     * 再生
     */
    await profileMusicAudio.play();

    updateProfileMusicPlayButtons(
      true
    );

    /*
     * 読み込み完了後は通常Toastへ戻す
     */
    showToast(
      `▶ ${t.name}`
    );

  }catch(e){

    console.error(
      "プロフィール音楽再生エラー:",
      e
    );

    updateProfileMusicPlayButtons(
      false
    );

    showToast(
      "音楽を再生できませんでした"
    );
  }
}
function stopProfileMusic() {
  if (profileMusicAudio) {
    try {
      profileMusicAudio.pause(), (profileMusicAudio.currentTime = 0);
    } catch (e) {
      console.error(e);
    }
    profileMusicAudio = null;
  }
  profileMusicObjectUrl &&
    (URL.revokeObjectURL(profileMusicObjectUrl),
    (profileMusicObjectUrl = null)),
    updateProfileMusicPlayButtons(!1);
}
function updateProfileMusicPlayButtons(e) {
  document.querySelectorAll(".profileMusicPlayButton").forEach((t) => {
    t.textContent = e ? "⏸ 再生中" : "▶ 再生";
  });
}

function renderHomeLoadMore() {
  const container = $("homeLoadMore");
  if (!container) return;

  if (homeLoadingMore) {
    container.innerHTML = `
      <button
        class="secondary"
        disabled
        style="width:100%;padding:14px"
      >
        読み込み中...
      </button>
    `;
    return;
  }

  if (!homeHasMore) {
    container.innerHTML = "";
    container.classList.add("hidden");
    return;
  }

  container.classList.remove("hidden");

  container.innerHTML = `
    <button
      class="secondary"
      onclick="loadHomeMore()"
      style="width:100%;padding:14px"
    >
      もっと読み込む
    </button>
  `;
}
async function loadHomeMore() {
  if (homeLoadingMore || !homeHasMore) return;

  homeLoadingMore = true;
  renderHomeLoadMore();

  try {
    const from = homePageOffset;
    const to = from + HOME_PAGE_SIZE - 1;

    const { data, error } = await supabaseClient
      .from("posts")
      .select(`
        id,
        user_id,
        content,
        image_url,
        image_mqtt,
        is_limited,
        quote_post_id,
        poll,
        created_at,
        views
      `)
      .order("created_at", { ascending: false })
      .range(from, to);

    if (error) {
      console.error("追加投稿取得エラー:", error);
      toast("投稿を読み込めませんでした");
      return;
    }

    let posts = data || [];

    // 限定投稿を見られない場合は除外
    if (!canSeeLimited()) {
      posts = posts.filter(post => post.is_limited !== true);
    }

    // 取得した件数を進める
    homePageOffset += HOME_PAGE_SIZE;

    // 20件未満なら今回で最後
    if ((data || []).length < HOME_PAGE_SIZE) {
      homeHasMore = false;
    }

    if (!posts.length) {
      renderHomeLoadMore();
      return;
    }

    const users = await getUsers(
      posts.map(post => post.user_id)
    );

    const userMap = new Map(
      users.map(user => [user.id, user])
    );

    const meta = await getPostMeta(
      posts.map(post => post.id)
    );

    const container = $("homePosts");

    for (const post of posts) {
      const user = userMap.get(post.user_id);

      if (!user) continue;

      cache.posts.set(post.id, post);

      container.appendChild(
        createPostElement(post, user, meta)
      );
    }

  } catch (err) {
    console.error("loadHomeMore unexpected error:", err);
    toast("投稿を読み込めませんでした");

  } finally {
    homeLoadingMore = false;
    renderHomeLoadMore();
  }
}

   */

    );

  }else{
