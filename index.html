
<!doctype html>
<html lang=ja>

    <head>
        <meta charset=UTF-8>
        <meta name=viewport content="width=device-width,initial-scale=1">
        <title>chanpro-Post</title>
        <link rel=icon type=image/png href=https://qiita-image-store.s3.ap-northeast-1.amazonaws.com/0/4422522/32d91302-ff79-4e42-b0f3-866c7c1427d5.png>
        <script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2>

        </script>
        <script src=https://unpkg.com/mqtt/dist/mqtt.min.js>

        </script>
        <style>
            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f7f9fa;
                color: #0f1419
            }

            button,
            input,
            textarea {
                font: inherit
            }

            button {
                cursor: pointer
            }

            .hidden {
                display: none !important
            }

            .app {
                display: grid;
                grid-template-columns: 260px minmax(0, 650px) 320px;
                max-width: 1250px;
                margin: auto;
                min-height: 100vh
            }

            .sidebar {
                position: sticky;
                top: 0;
                height: 100vh;
                padding: 20px;
                border-right: 1px solid #e1e8ed;
                background: #fff
            }

            .logo {
                font-size: 24px;
                font-weight: 800;
                color: #1d9bf0;
                margin-bottom: 25px;
                display: flex;
                align-items: center;
                gap: 10px
            }

            .logo img {
                height: 50px;
                width: auto
            }

            @media (max-width:600px) {
                .logo span {
                    display: none
                }
            }

            .nav button {
                display: block;
                width: 100%;
                text-align: left;
                border: 0;
                background: 0 0;
                padding: 13px 15px;
                border-radius: 25px;
                margin: 4px 0;
                font-size: 16px
            }

            .nav button:hover {
                background: #eef7fd
            }

            .postButton {
                width: 100%;
                border: 0;
                background: #1d9bf0;
                color: #fff;
                padding: 13px;
                border-radius: 25px;
                font-weight: 700;
                margin-top: 20px
            }

            .main {
                min-width: 0;
                border-right: 1px solid #e1e8ed;
                background: #fff
            }

            .pageHeader {
                position: sticky;
                top: 0;
                z-index: 10;
                background: rgba(255, 255, 255, .94);
                backdrop-filter: blur(8px);
                padding: 15px;
                border-bottom: 1px solid #e1e8ed;
                font-weight: 800
            }

            .composer {
                padding: 15px;
                border-bottom: 1px solid #e1e8ed
            }

            .composer textarea {
                width: 100%;
                min-height: 90px;
                border: 0;
                outline: 0;
                resize: none;
                font-size: 18px
            }

            .composer input {
                width: 100%;
                border: 1px solid #cfd9de;
                border-radius: 10px;
                padding: 10px;
                margin-top: 8px
            }

            .composerBottom {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 10px
            }

            .primary {
                background: #1d9bf0;
                color: #fff;
                border: 0;
                border-radius: 22px;
                padding: 9px 18px;
                font-weight: 700
            }

            .secondary {
                background: #fff;
                color: #0f1419;
                border: 1px solid #cfd9de;
                border-radius: 22px;
                padding: 8px 15px;
                font-weight: 700
            }

            .danger {
                background: #f4212e;
                color: #fff;
                border: 0;
                border-radius: 20px;
                padding: 8px 15px
            }

            .post {
                padding: 15px;
                border-bottom: 1px solid #e1e8ed;
                transition: .15s
            }

            .post:hover {
                background: #fafafa
            }

            .postHead {
                display: flex;
                gap: 10px
            }

            .avatar {
                width: 45px;
                height: 45px;
                border-radius: 50%;
                object-fit: cover;
                background: #ddd
            }

            .postUser {
                font-weight: 700
            }

            .handle {
                color: #536471;
                font-size: 14px
            }

            .postText {
                margin: 8px 0;
                white-space: pre-wrap;
                word-break: break-word;
                cursor: pointer
            }

            .postLinkPreviews {
                margin: 10px 0
            }

            .postLinkPreviews a {
                cursor: pointer
            }

            .postImage {
                width: 100%;
                max-height: 450px;
                object-fit: cover;
                border-radius: 15px;
                margin-top: 8px;
                border: 1px solid #e1e8ed
            }

            .postActions {
                display: flex;
                justify-content: space-between;
                margin-top: 10px;
                color: #536471
            }

            .action {
                border: 0;
                background: 0 0;
                color: #536471;
                padding: 6px
            }

            .action:hover {
                color: #1d9bf0
            }

            .action.liked {
                color: #f91880
            }

            .action.reposted {
                color: #00ba7c
            }

            .rightbar {
                padding: 15px
            }

            .search {
                width: 100%;
                border: 0;
                background: #eff3f4;
                border-radius: 25px;
                padding: 12px 18px;
                outline: 0
            }

            .card {
                background: #f7f9f9;
                border-radius: 18px;
                padding: 15px;
                margin-top: 15px
            }

            .card h3 {
                margin-top: 0
            }

            .trend {
                padding: 9px 0;
                border-bottom: 1px solid #e1e8ed;
                cursor: pointer
            }

            .trend small {
                display: block;
                color: #536471
            }

            .userRow {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 0
            }

            .userRowInfo {
                flex: 1
            }

            .modal {
                border: 0;
                padding: 20px;
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
                background: rgba(0, 0, 0, .45)
            }

            .modal::backdrop {
                background: rgba(0, 0, 0, .45)
            }

            .modalBox {
                background: #fff;
                border-radius: 18px;
                width: min(600px, 100%);
                max-height: 90vh;
                overflow: auto;
                padding: 20px
            }

            .modalBox input,
            .modalBox textarea {
                width: 100%;
                padding: 10px;
                border: 1px solid #cfd9de;
                border-radius: 10px;
                margin: 7px 0
            }

            .profileCover {
                height: 180px;
                background: linear-gradient(135deg, #1d9bf0, #7856ff)
            }

            .profileInfo {
                padding: 15px
            }

            .profileBigAvatar {
                width: 100px;
                height: 100px;
                object-fit: cover;
                border-radius: 50%;
                border: 4px solid #fff;
                margin-top: -55px
            }

            .profileActions {
                float: right;
                margin-top: 10px
            }

            .profileHandle {
                color: #536471
            }

            .profileBio {
                margin-top: 12px;
                white-space: pre-wrap
            }

            .profileStats {
                display: flex;
                gap: 25px;
                margin-top: 15px
            }

            .profileStats div {
                display: flex;
                flex-direction: column
            }

            .profileStats span {
                color: #536471;
                font-size: 13px
            }

            .notification {
                padding: 15px;
                border-bottom: 1px solid #e1e8ed
            }

            .unread {
                background: #eef7fd
            }

            .dmList {
                border-bottom: 1px solid #e1e8ed
            }

            .dmUser {
                padding: 12px;
                border-bottom: 1px solid #e1e8ed;
                cursor: pointer
            }

            .dmMessages {
                height: 350px;
                overflow: auto;
                padding: 10px;
                background: #f7f9fa
            }

            .dmMessage {
                padding: 8px 12px;
                border-radius: 15px;
                background: #e8f1ff;
                margin: 5px;
                max-width: 75%
            }

            .dmMessage.me {
                margin-left: auto;
                background: #d9ffd9
            }

            .admin {
                padding: 15px
            }

            .adminRow {
                padding: 12px;
                border-bottom: 1px solid #e1e8ed
            }

            .empty {
                padding: 40px 20px;
                text-align: center;
                color: #536471
            }

            .toast {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #0f1419;
                color: #fff;
                padding: 12px 20px;
                border-radius: 25px;
                z-index: 1000
            }

            @media(max-width:1000px) {
                .app {
                    grid-template-columns: 80px minmax(0, 650px) 0
                }

                .rightbar {
                    display: none
                }

                .logo {
                    font-size: 0
                }

                .logo:after {
                    content: "CP";
                    font-size: 22px
                }

                .nav button {
                    font-size: 0;
                    text-align: center
                }

                .nav button:first-letter {
                    font-size: 22px
                }
            }

            @media(max-width:650px) {
                .app {
                    display: block
                }

                .sidebar {
                    position: fixed;
                    bottom: 0;
                    top: auto;
                    height: 60px;
                    width: 100%;
                    z-index: 50;
                    padding: 5px;
                    border-top: 1px solid #e1e8ed;
                    border-right: 0
                }

                .logo,
                .postButton {
                    display: none
                }

                .nav {
                    display: flex;
                    justify-content: space-around
                }

                .nav button {
                    margin: 0;
                    width: auto;
                    padding: 10px
                }

                .main {
                    padding-bottom: 60px
                }
            }

            .profileStatClickable {
                cursor: pointer
            }

            .profileStatClickable:hover b,
            .profileStatClickable:hover span {
                color: #1d9bf0
            }

            .profileCover {
                height: 180px;
                background-color: #1d9bf0;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat
            }

            .detailBack {
                display: flex;
                align-items: center;
                gap: 15px
            }

            .detailBack button {
                font-size: 20px;
                padding: 4px 10px
            }

            .detailPostWrap {
                border-bottom: 1px solid #e1e8ed;
                padding: 15px
            }

            .detailPostText {
                font-size: 20px;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
                margin: 10px 0
            }

            .detailMeta {
                color: #536471;
                font-size: 14px;
                padding: 8px 0;
                border-top: 1px solid #e1e8ed;
                border-bottom: 1px solid #e1e8ed;
                margin-top: 10px
            }

            .detailComposer {
                padding: 15px;
                border-bottom: 1px solid #e1e8ed
            }

            .detailComposer textarea {
                width: 100%;
                min-height: 80px;
                border: 0;
                outline: 0;
                resize: none;
                font-size: 17px;
                padding: 8px 0
            }

            .reply {
                padding: 12px 15px;
                border-bottom: 1px solid #e1e8ed
            }

            .replyHead {
                display: flex;
                gap: 10px
            }

            .replyAvatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                object-fit: cover;
                background: #ddd;
                cursor: pointer
            }

            .replyBody {
                flex: 1;
                min-width: 0
            }

            .replyUser {
                font-weight: 700;
                cursor: pointer
            }

            .replyText {
                margin: 4px 0;
                white-space: pre-wrap;
                word-break: break-word
            }

            .replyActions {
                display: flex;
                gap: 18px;
                margin-top: 6px;
                color: #536471;
                font-size: 13px
            }

            .replyActions button {
                border: 0;
                background: 0 0;
                color: #536471;
                padding: 4px 6px;
                border-radius: 14px
            }

            .replyActions button:hover {
                color: #1d9bf0;
                background: #eef7fd
            }

            .replyChildren {
                margin-left: 30px;
                border-left: 2px solid #e1e8ed;
                padding-left: 10px;
                margin-top: 8px
            }

            .replyComposerInline {
                padding: 10px;
                background: #f7f9fa;
                border-bottom: 1px solid #e1e8ed
            }

            .replyComposerInline textarea {
                width: 100%;
                min-height: 60px;
                border: 1px solid #cfd9de;
                border-radius: 12px;
                padding: 8px;
                outline: 0;
                resize: none
            }

            .replyToHint {
                color: #1d9bf0;
                font-size: 13px;
                margin-bottom: 4px
            }

            .navNotification {
                position: relative
            }

            .notificationDot {
                position: absolute;
                top: 0;
                right: 0;
                width: 15px;
                height: 15px;
                background: #f4212e;
                border-radius: 50%;
                border: 2px solid #fff
            }

            button img {
                width: 20px;
                height: 20px;
                object-fit: contain;
                vertical-align: middle;
                margin-right: 6px
            }

            .profileMusicSection {
                margin-top: 18px;
                padding: 16px;
                border: 1px solid #e1e8ed;
                border-radius: 16px;
                background: #f8fafb
            }

            .profileMusicHeader {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 12px
            }

            .profileMusicTitle {
                font-size: 17px;
                font-weight: 800
            }

            .profileMusicSub {
                color: #536471;
                font-size: 13px;
                margin-top: 3px
            }

            .profileMusicEmpty {
                padding: 14px;
                text-align: center;
                color: #536471;
                background: #fff;
                border-radius: 12px;
                border: 1px dashed #cfd9de
            }

            .profileMusicCard {
                background: #fff;
                border: 1px solid #e1e8ed;
                border-radius: 14px;
                padding: 14px
            }

            .profileMusicInfo {
                display: flex;
                align-items: center;
                gap: 12px;
                min-width: 0
            }

            .profileMusicIcon {
                width: 48px;
                height: 48px;
                min-width: 48px;
                border-radius: 50%;
                background: linear-gradient(135deg, #1d9bf0, #7856ff);
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 23px
            }

            .profileMusicName {
                font-weight: 700;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap
            }

            .profileMusicSize {
                color: #536471;
                font-size: 12px;
                margin-top: 3px
            }

            .profileMusicControls {
                display: flex;
                gap: 8px;
                margin-top: 12px
            }

            .profileMusicPlayButton {
                flex: 1;
                border: 0;
                background: #1d9bf0;
                color: #fff;
                border-radius: 22px;
                padding: 9px 14px;
                font-weight: 700
            }

            .profileMusicPlayButton:hover {
                background: #1688d8
            }

            .profileMusicStopButton {
                border: 1px solid #cfd9de;
                background: #fff;
                color: #0f1419;
                border-radius: 22px;
                padding: 9px 14px;
                font-weight: 700
            }

            .profileMusicDrop {
                margin-top: 10px;
                border: 2px dashed #cfd9de;
                border-radius: 14px;
                padding: 18px;
                text-align: center;
                cursor: pointer;
                background: #fff;
                transition: .15s
            }

            .profileMusicDrop:hover {
                border-color: #1d9bf0;
                background: #f7fbff
            }

            .profileMusicDrop.dragover {
                border-color: #1d9bf0;
                background: #eef7fd
            }

            .profileMusicDrop strong {
                display: block;
                margin-bottom: 5px
            }

            .profileMusicDrop small {
                color: #536471
            }

            .profileMusicProgressWrap {
                margin-top: 12px;
                display: none
            }

            .profileMusicProgressWrap.show {
                display: block
            }

            .profileMusicProgress {
                width: 100%;
                height: 8px;
                background: #e1e8ed;
                border-radius: 99px;
                overflow: hidden
            }

            .profileMusicProgressBar {
                width: 0%;
                height: 100%;
                background: #1d9bf0;
                transition: width .15s
            }

            .profileMusicProgressText {
                margin-top: 5px;
                font-size: 12px;
                color: #536471;
                text-align: center
            }

            .profileMusicFileInput {
                display: none
            }

            .profileMusicDanger {
                border: 1px solid #f4212e;
                background: #fff;
                color: #f4212e;
                border-radius: 22px;
                padding: 8px 13px;
                font-weight: 700
            }

            .profileMusicDanger:hover {
                background: #fff1f2
            }

            .profileMusicModalInfo {
                padding: 10px 12px;
                background: #f7f9fa;
                border-radius: 10px;
                margin-bottom: 12px;
                font-size: 13px;
                color: #536471
            }

            .profileMusicCurrent {
                margin-bottom: 12px
            }

            .profileMusicCurrentLabel {
                font-size: 12px;
                color: #536471;
                margin-bottom: 5px
            }

            .profileMusicUploadLabel {
                display: block;
                font-size: 14px;
                font-weight: 700;
                margin-top: 12px
            }

            .quotePostCard {
                margin-top: 10px;
                border: 1px solid #cfd9de;
                border-radius: 14px;
                padding: 12px;
                background: #fff;
                cursor: pointer
            }

            .quotePostCard:hover {
                background: #f7f9fa
            }

            .quotePostHead {
                display: flex;
                align-items: center;
                gap: 8px
            }

            .quotePostAvatar {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                object-fit: cover;
                background: #ddd
            }

            .quotePostText {
                margin-top: 6px;
                white-space: pre-wrap;
                word-break: break-word;
                color: #0f1419
            }

            .quotePostImage {
                width: 100%;
                max-height: 260px;
                object-fit: cover;
                border-radius: 10px;
                margin-top: 8px
            }

            .pollCard {
                margin-top: 10px;
                border: 1px solid #cfd9de;
                border-radius: 14px;
                padding: 14px;
                background: #fff
            }

            .pollQuestion {
                font-weight: 700;
                margin-bottom: 10px;
                white-space: pre-wrap;
                word-break: break-word
            }

            .pollOption {
                display: block;
                width: 100%;
                text-align: left;
                border: 1px solid #1d9bf0;
                background: #fff;
                color: #1d9bf0;
                border-radius: 20px;
                padding: 9px 12px;
                margin: 7px 0;
                position: relative;
                overflow: hidden
            }

            .pollOption:hover {
                background: #eef7fd
            }

            .pollOption.disabled {
                cursor: default
            }

            .pollOptionFill {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                background: #e8f4fb;
                z-index: 0
            }

            .pollOptionText {
                position: relative;
                z-index: 1;
                display: flex;
                justify-content: space-between;
                gap: 10px
            }

            .pollTotal {
                font-size: 12px;
                color: #536471;
                margin-top: 8px
            }

            .pollPreview {
                margin-top: 10px;
                border: 1px solid #cfd9de;
                border-radius: 12px;
                padding: 10px;
                background: #f7f9fa
            }

            .composerTools {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap
            }

            .toolButton {
                border: 0;
                background: 0 0;
                color: #1d9bf0;
                font-weight: 700;
                padding: 7px 10px;
                border-radius: 18px
            }

            .toolButton:hover {
                background: #eef7fd
            }

            .postImageUploadRow {
                display: flex;
                gap: 8px;
                align-items: center;
                margin-top: 8px;
                flex-wrap: wrap
            }

            .postImageUploadButton {
                border: 1px solid #cfd9de;
                background: #fff;
                color: #1d9bf0;
                border-radius: 20px;
                padding: 8px 14px;
                font-weight: 700;
                cursor: pointer
            }

            .postImageUploadButton:hover {
                background: #eef7fd
            }

            .postImageFileInput {
                display: none
            }

            .postImagePreview {
                position: relative;
                margin-top: 10px
            }

            .postImagePreview img {
                display: block;
                width: 100%;
                max-height: 360px;
                object-fit: contain;
                background: #f7f9fa;
                border: 1px solid #e1e8ed;
                border-radius: 14px
            }

            .postImageRemove {
                position: absolute;
                right: 8px;
                top: 8px;
                border: 0;
                border-radius: 50%;
                width: 32px;
                height: 32px;
                background: rgba(0, 0, 0, .7);
                color: #fff;
                cursor: pointer;
                font-size: 18px
            }

            .mqttPostImage {
                display: block;
                width: 100%;
                max-height: 450px;
                object-fit: cover;
                border-radius: 15px;
                margin-top: 8px;
                border: 1px solid #e1e8ed;
                background: #f7f9fa
            }

            .mqttImageLoading {
                margin-top: 8px;
                padding: 12px;
                text-align: center;
                color: #536471;
                background: #f7f9fa;
                border-radius: 12px
            }

            .linkPreviewArea {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-top: 10px
            }

            .linkPreviewLoading {
                padding: 10px;
                color: #536471;
                font-size: 13px;
                text-align: center;
                background: #f7f9fa;
                border-radius: 10px
            }

            .linkPreviewCard {
                display: block;
                overflow: hidden;
                border: 1px solid #e1e8ed;
                border-radius: 14px;
                background: #fff;
                text-decoration: none;
                color: #0f1419
            }

            .linkPreviewCard:hover {
                background: #f7f9fa
            }

            .linkPreviewCard .lpImage {
                display: block;
                width: 100%;
                aspect-ratio: 1.91/1;
                object-fit: cover;
                background: #f3f4f6
            }

            .linkPreviewCard .lpInfo {
                padding: 11px 13px
            }

            .linkPreviewCard .lpService {
                font-size: 11px;
                font-weight: 700;
                color: #536471;
                margin-bottom: 4px
            }

            .linkPreviewCard .lpTitle {
                font-weight: 700;
                line-height: 1.4
            }

            .linkPreviewCard .lpDesc {
                font-size: 13px;
                color: #536471;
                margin-top: 4px
            }

            .linkPreviewCard .lpDomain {
                font-size: 12px;
                color: #536471;
                margin-top: 7px
            }

            let mqttReadyPromise = null;
            let mqttReadyResolve = null;
            let mqttReadyReject = null;
            
            function connectMQTT(){
            
              // すでに接続済み
              if(mqttClient?.connected){
                return Promise.resolve();
              }
            
              // 接続処理中なら、そのPromiseをそのまま返す
              if(mqttReadyPromise){
                return mqttReadyPromise;
              }
            
              mqttReadyPromise = new Promise((resolve,reject)=>{
                mqttReadyResolve = resolve;
                mqttReadyReject = reject;
              });
            
              console.log("MQTT接続開始");
            
              try{
            
                const clientId =
                  `chanpro-post-${Date.now()}-${Math.random()
                    .toString(16)
                    .slice(2)}`;
            
                mqttClient = mqtt.connect(
                  MQTT_BROKER,
                  {
                    clientId,
                    clean:true,
                    reconnectPeriod:3000,
                    connectTimeout:10000
                  }
                );
            
                mqttClient.on("connect",()=>{
            
                  console.log("MQTT接続成功");
            
                  // グローバル購読
                  mqttClient.subscribe(
                    mqttTopicGlobal(),
                    {qos:0},
                    err=>{
                      if(err){
                        console.error("MQTT subscribe global:",err);
                      }
                    }
                  );
            
                  // ログイン済みならユーザー用も購読
                  if(currentUser?.id){
            
                    mqttClient.subscribe(
                      mqttTopicUser(currentUser.id),
                      {qos:0},
                      err=>{
                        if(err){
                          console.error("MQTT subscribe user:",err);
                        }
                      }
                    );
            
                  }
            
                  // MQTT接続完了
                  if(mqttReadyResolve){
            
                    mqttReadyResolve();
            
                    mqttReadyResolve=null;
                    mqttReadyReject=null;
                  }
            
                });
            
                mqttClient.on("reconnect",()=>{
                  console.log("MQTT再接続中...");
                });
            
                mqttClient.on("error",err=>{
                  console.error("MQTT error:",err);
            
                  // 初回接続失敗だけPromiseを拒否
                  if(mqttReadyReject){
            
                    mqttReadyReject(err);
            
                    mqttReadyResolve=null;
                    mqttReadyReject=null;
            
                    mqttReadyPromise=null;
                  }
                });
            
                mqttClient.on("offline",()=>{
                  console.log("MQTT offline");
                });
            
                mqttClient.on("close",()=>{
                  console.log("MQTT接続終了");
                });
            
                mqttClient.on("message",async(topic,payload)=>{
            
                  try{
            
                    const data=JSON.parse(payload.toString());
            
                    await handleMQTTEvent(data);
            
                  }catch(err){
            
                    console.error(
                      "MQTT message error:",
                      err
                    );
            
                  }
            
                });
            
              }catch(err){
            
                console.error(
                  "MQTT接続開始失敗:",
                  err
                );
            
                mqttReadyPromise=null;
            
                if(mqttReadyReject){
                  mqttReadyReject(err);
                }
            
                mqttReadyResolve=null;
                mqttReadyReject=null;
            
                mqttClient=null;
            
              }
            
              return mqttReadyPromise;
            }
