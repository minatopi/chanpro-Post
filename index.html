<!doctype html>
<html lang=ja>

<head>
    <meta charset=UTF-8>
    <meta name=viewport content="width=device-width,initial-scale=1">
    <title>chanpro-Post</title>
    <link rel=icon type=image/png
        href=https://qiita-image-store.s3.ap-northeast-1.amazonaws.com/0/4422522/6c28fb79-5ca6-4b57-afa1-9cd0bfa4aef8.png>
    <script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2></script>
    <script src=https://unpkg.com/mqtt/dist/mqtt.min.js></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f9fa;
            color: #0f1419
        }

        button,
        input,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .hidden {
            display: none !important
        }

        .app {
            display: grid;
            grid-template-columns: 260px minmax(0, 650px) 320px;
            max-width: 1250px;
            margin: auto;
            min-height: 100vh
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 20px;
            border-right: 1px solid #e1e8ed;
            background: #fff
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #1d9bf0;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .logo img {
            height: 50px;
            width: auto
        }

        @media (max-width:600px) {
            .logo span {
                display: none
            }
        }

        .nav button {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: 0 0;
            padding: 13px 15px;
            border-radius: 25px;
            margin: 4px 0;
            font-size: 16px
        }

        .nav button:hover {
            background: #eef7fd
        }

        .postButton {
            width: 100%;
            border: 0;
            background: #1d9bf0;
            color: #fff;
            padding: 13px;
            border-radius: 25px;
            font-weight: 700;
            margin-top: 20px
        }

        .main {
            min-width: 0;
            border-right: 1px solid #e1e8ed;
            background: #fff
        }

        .pageHeader {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            font-weight: 800
        }

        .composer {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .composer textarea {
            width: 100%;
            min-height: 90px;
            border: 0;
            outline: 0;
            resize: none;
            font-size: 18px
        }

        .composer input {
            width: 100%;
            border: 1px solid #cfd9de;
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px
        }

        .composerBottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px
        }

        .primary {
            background: #1d9bf0;
            color: #fff;
            border: 0;
            border-radius: 22px;
            padding: 9px 18px;
            font-weight: 700
        }

        .secondary {
            background: #fff;
            color: #0f1419;
            border: 1px solid #cfd9de;
            border-radius: 22px;
            padding: 8px 15px;
            font-weight: 700
        }

        .danger {
            background: #f4212e;
            color: #fff;
            border: 0;
            border-radius: 20px;
            padding: 8px 15px
        }

        .post {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            transition: .15s
        }

        .post:hover {
            background: #fafafa
        }

        .postHead {
            display: flex;
            gap: 10px
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd
        }

        .postUser {
            font-weight: 700
        }

        .handle {
            color: #536471;
            font-size: 14px
        }

        .postText {
            margin: 8px 0;
            white-space: pre-wrap;
            word-break: break-word;
            cursor: pointer
        }

        .postImage {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 15px;
            margin-top: 8px;
            border: 1px solid #e1e8ed
        }

        .postActions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #536471
        }

        .action {
            border: 0;
            background: 0 0;
            color: #536471;
            padding: 6px
        }

        .action:hover {
            color: #1d9bf0
        }

        .action.liked {
            color: #f91880
        }

        .action.reposted {
            color: #00ba7c
        }

        .rightbar {
            padding: 15px
        }

        .search {
            width: 100%;
            border: 0;
            background: #eff3f4;
            border-radius: 25px;
            padding: 12px 18px;
            outline: 0
        }

        .card {
            background: #f7f9f9;
            border-radius: 18px;
            padding: 15px;
            margin-top: 15px
        }

        .card h3 {
            margin-top: 0
        }

        .trend {
            padding: 9px 0;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer
        }

        .trend small {
            display: block;
            color: #536471
        }

        .userRow {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0
        }

        .userRowInfo {
            flex: 1
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px
        }

        .modalBox {
            background: #fff;
            border-radius: 18px;
            width: min(600px, 100%);
            max-height: 90vh;
            overflow: auto;
            padding: 20px
        }

        .modalBox input,
        .modalBox textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cfd9de;
            border-radius: 10px;
            margin: 7px 0
        }

        .profileCover {
            height: 180px;
            background: linear-gradient(135deg, #1d9bf0, #7856ff)
        }

        .profileInfo {
            padding: 15px
        }

        .profileBigAvatar {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-top: -55px
        }

        .profileActions {
            float: right;
            margin-top: 10px
        }

        .profileHandle {
            color: #536471
        }

        .profileBio {
            margin-top: 12px;
            white-space: pre-wrap
        }

        .profileStats {
            display: flex;
            gap: 25px;
            margin-top: 15px
        }

        .profileStats div {
            display: flex;
            flex-direction: column
        }

        .profileStats span {
            color: #536471;
            font-size: 13px
        }

        .notification {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .unread {
            background: #eef7fd
        }

        .dmList {
            border-bottom: 1px solid #e1e8ed
        }

        .dmUser {
            padding: 12px;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer
        }

        .dmMessages {
            height: 350px;
            overflow: auto;
            padding: 10px;
            background: #f7f9fa
        }

        .dmMessage {
            padding: 8px 12px;
            border-radius: 15px;
            background: #e8f1ff;
            margin: 5px;
            max-width: 75%
        }

        .dmMessage.me {
            margin-left: auto;
            background: #d9ffd9
        }

        .admin {
            padding: 15px
        }

        .adminRow {
            padding: 12px;
            border-bottom: 1px solid #e1e8ed
        }

        .empty {
            padding: 40px 20px;
            text-align: center;
            color: #536471
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f1419;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            z-index: 1000
        }

        @media(max-width:1000px) {
            .app {
                grid-template-columns: 80px minmax(0, 650px) 0
            }

            .rightbar {
                display: none
            }

            .logo {
                font-size: 0
            }

            .logo:after {
                content: "CP";
                font-size: 22px
            }

            .nav button {
                font-size: 0;
                text-align: center
            }

            .nav button:first-letter {
                font-size: 22px
            }
        }

        @media(max-width:650px) {
            .app {
                display: block
            }

            .sidebar {
                position: fixed;
                bottom: 0;
                top: auto;
                height: 60px;
                width: 100%;
                z-index: 50;
                padding: 5px;
                border-top: 1px solid #e1e8ed;
                border-right: 0
            }

            .logo,
            .postButton {
                display: none
            }

            .nav {
                display: flex;
                justify-content: space-around
            }

            .nav button {
                margin: 0;
                width: auto;
                padding: 10px
            }

            .main {
                padding-bottom: 60px
            }
        }

        .profileStatClickable {
            cursor: pointer
        }

        .profileStatClickable:hover b,
        .profileStatClickable:hover span {
            color: #1d9bf0
        }

        .profileCover {
            height: 180px;
            background-color: #1d9bf0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat
        }

        .detailBack {
            display: flex;
            align-items: center;
            gap: 15px
        }

        .detailBack button {
            font-size: 20px;
            padding: 4px 10px
        }

        .detailPostWrap {
            border-bottom: 1px solid #e1e8ed;
            padding: 15px
        }

        .detailPostText {
            font-size: 20px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 10px 0
        }

        .detailMeta {
            color: #536471;
            font-size: 14px;
            padding: 8px 0;
            border-top: 1px solid #e1e8ed;
            border-bottom: 1px solid #e1e8ed;
            margin-top: 10px
        }

        .detailComposer {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .detailComposer textarea {
            width: 100%;
            min-height: 80px;
            border: 0;
            outline: 0;
            resize: none;
            font-size: 17px;
            padding: 8px 0
        }

        .reply {
            padding: 12px 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .replyHead {
            display: flex;
            gap: 10px
        }

        .replyAvatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            cursor: pointer
        }

        .replyBody {
            flex: 1;
            min-width: 0
        }

        .replyUser {
            font-weight: 700;
            cursor: pointer
        }

        .replyText {
            margin: 4px 0;
            white-space: pre-wrap;
            word-break: break-word
        }

        .replyActions {
            display: flex;
            gap: 18px;
            margin-top: 6px;
            color: #536471;
            font-size: 13px
        }

        .replyActions button {
            border: 0;
            background: 0 0;
            color: #536471;
            padding: 4px 6px;
            border-radius: 14px
        }

        .replyActions button:hover {
            color: #1d9bf0;
            background: #eef7fd
        }

        .replyChildren {
            margin-left: 30px;
            border-left: 2px solid #e1e8ed;
            padding-left: 10px;
            margin-top: 8px
        }

        .replyComposerInline {
            padding: 10px;
            background: #f7f9fa;
            border-bottom: 1px solid #e1e8ed
        }

        .replyComposerInline textarea {
            width: 100%;
            min-height: 60px;
            border: 1px solid #cfd9de;
            border-radius: 12px;
            padding: 8px;
            outline: 0;
            resize: none
        }

        .replyToHint {
            color: #1d9bf0;
            font-size: 13px;
            margin-bottom: 4px
        }
        .navNotification {
          position: relative;
        }
        
        .notificationDot {
          position: absolute;
          top: 0;
          right: 0;
          width: 15px;
          height: 15px;
          background: #f4212e;
          border-radius: 50%;
          border: 2px solid #fff;
        }
        button img {
          width: 20px;
          height: 20px;
          object-fit: contain;
          vertical-align: middle;
          margin-right: 6px;
        }

    </style>
</head>

<body>
    <div id=loginPage>
        <div
            style="max-width:420px;margin:80px auto;padding:25px;background:#fff;border-radius:20px;box-shadow:0 5px 30px rgba(0,0,0,.08)">
            <h1 style=color:#1d9bf0>chanpro-Post</h1>
            <p>chanpro-Chat と共通アカウント</p>
            <input id=loginName placeholder=ユーザー名 style="width:100%;padding:12px;margin:5px 0">
            <input id=loginPassword type=password placeholder=パスワード style="width:100%;padding:12px;margin:5px 0">
            <button class=primary style=width:100%;margin-top:10px onclick=login()>ログイン</button>
            <button class=secondary style=width:100%;margin-top:8px onclick=createAccount()>新規アカウント作成</button>
            <div id=loginError style=color:#f4212e;margin-top:10px></div>
        </div>
    </div>
    <div id=app class="app hidden">
        <aside class=sidebar>
            <div class=logo>
                <img src=https://qiita-image-store.s3.ap-northeast-1.amazonaws.com/0/4422522/6c28fb79-5ca6-4b57-afa1-9cd0bfa4aef8.png
                    alt="">
                <span>chanpro-Post</span>
            </div>
            <div class=nav>
                <button onclick='showPage("home")'>
                  <img src="https://img.icons8.com/?size=96&id=TzMnSwiJW8HO&format=png" alt="ホーム"> ホーム
                </button>
                
                <button onclick='showPage("search")'>
                  <img src="https://img.icons8.com/?size=96&id=12773&format=png" alt="検索"> 検索
                </button>
                
                <button id="notificationNav" class="navNotification" onclick='showPage("notifications")'>
                  <img src="https://img.icons8.com/?size=80&id=41913&format=png" alt="通知"> 通知
                  <span id="notificationDot" class="notificationDot hidden"></span>
                </button>
                
                <button onclick='showFollowingLatestPosts()'>
                  <img src="https://img.icons8.com/?size=160&id=fqKHVbd4GWbD&format=png" alt="フォロー中"> フォロー中
                </button>
                
                <button onclick='showPage("messages")'>
                  <img src="https://img.icons8.com/?size=160&id=bz2nLhYZWgCb&format=png" alt="DM"> DM
                </button>
                
                <button onclick='showMyProfile()'>
                  <img src="https://img.icons8.com/?size=96&id=IerOpHeUt2OH&format=png" alt="プロフィール"> プロフィール
                </button>
                
                <button onclick='showBookmarks()'>
                  <img src="https://img.icons8.com/?size=160&id=42404&format=png" alt="ブックマーク"> ブックマーク
                </button>
                
                <button id="adminNav" class="hidden" onclick='showPage("admin")'>
                  <img src="https://img.icons8.com/?size=96&id=szJmuYXfPSIN&format=png" alt="管理"> 管理
                </button>

            </div>
            <button class=postButton onclick=openPostModal()>投稿</button>
            <button class=secondary style=width:100%;margin-top:10px onclick=logout()>ログアウト</button>
        </aside>
        <main class=main>
            <div id=homePage>
                <div class=pageHeader>ホーム</div>
                <div class=composer>
                    <textarea id=quickPostText placeholder=いまどうしてる？></textarea>
                    <input id=quickPostImage placeholder=画像URL（任意）>
                    <button id=quickLimitedToggle class="secondary hidden" style="margin-top:8px;width:100%"
                        onclick="toggleQuickLimited()">一般公開</button>
                    <div class=composerBottom>
                        <span>#ハッシュタグ対応</span>
                        <button class=primary onclick=quickPost()>投稿</button>
                    </div>
                </div>
                <div id=homePosts></div>
            </div>
            <div id=searchPage class=hidden>
                <div class=pageHeader>検索</div>
                <div style=padding:15px>
                    <input id=searchInput class=search placeholder=ユーザー・投稿・#ハッシュタグ
                        onkeydown='"Enter"===event.key&&searchAll(this.value)'>
                </div>
                <div id=searchResults></div>
            </div>
            <div id=notificationPage class=hidden>
                <div class=pageHeader>通知</div>
                <div id=notifications></div>
            </div>
            <div id=messagesPage class=hidden>
                <div class=pageHeader>DM</div>
                <div id=dmContent></div>
            </div>
            <div id=profilePage class=hidden></div>
            <div id=bookmarksPage class=hidden>
                <div class=pageHeader>ブックマーク</div>
                <div id=bookmarkPosts></div>
            </div>
            <div id=detailPage class=hidden>
                <div class="pageHeader detailBack">
                    <button class=secondary onclick='showPage("home")'>←</button>
                    <span>投稿</span>
                </div>
                <div id=detailContent></div>
            </div>
            <div id=adminPage class=hidden>
                <div class=pageHeader>管理者</div>
                <div id=adminContent></div>
            </div>
        </main>
        <aside class=rightbar>
            <div class=card>
                <h3>トレンド</h3>
                <div id=trends></div>
            </div>
            <div class=card>
                <h3>おすすめユーザー</h3>
                <div id=suggestedUsers></div>
            </div>
        </aside>
    </div>
    <div id=modal class="modal hidden" onclick="event.target===this&&closeModal()">
        <div class=modalBox id=modalContent></div>
    </div>
    <div id=toast class="toast hidden"></div>
<script>
const SUPABASE_URL = "https://ldnmqfmebvyzlmhgnljf.supabase.co",
  SUPABASE_ANON_KEY = "sb_publishable_sJCCy8PpxucgNgweKh9jsA_BKne3v3U",
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null,
  currentDMUser = null,
  dmChannel = null,
  mqttClient = null,
  currentDetailPost = null,
  quickLimited = false,
  modalLimited = false;
function toggleQuickLimited() {
  if (!currentUser?.verified) return;
  quickLimited = !quickLimited;
  const b = $("quickLimitedToggle");
  b.classList.toggle("primary", quickLimited);
  b.classList.toggle("secondary", !quickLimited);
  b.textContent = quickLimited
    ? "限定投稿（認証済みのみ閲覧可）"
    : "一般公開";
}
function toggleModalLimited() {
  if (!currentUser?.verified) return;
  modalLimited = !modalLimited;
  const b = $("modalLimitedToggle");
  b.classList.toggle("primary", modalLimited);
  b.classList.toggle("secondary", !modalLimited);
  b.textContent = modalLimited
    ? "限定投稿（認証済みのみ閲覧可）"
    : "一般公開";
}
function canSeeLimited() {
  return !!currentUser?.verified;
}
const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt",
  cache = {
    users: new Map(),
    posts: new Map(),
    follows: null,
    trends: null,
    suggestedUsers: null,
  };
function $(e) {
  return document.getElementById(e);
}
function linkifyText(e) {
  return escapeHTML(e).replace(/https?:\/\/[^\s<]+/g, (e) => {
    const t = e.match(/^(.+?)([.,!?、。)）\]】]+)?$/),
      n = t ? t[1] : e;
    return `<a\n        href="${n}"\n        target="_blank"\n        rel="noopener noreferrer"\n        style="color:#1d9bf0;text-decoration:underline;"\n      >${n}</a>${t?.[2] || ""}`;
  });
}
function escapeHTML(e) {
  return String(e ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")

function avatarURL(e, t = 100) {
  return e || `https://placehold.jp/${t}x${t}.png`;
}

function connectMQTT() {
  if (!currentUser) return;
  if (mqttClient) {
    try {
      mqttClient.end(!0);
    } catch {}
    mqttClient = null;
  }
  const e = `chanpro-post-${currentUser.id}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  ((mqttClient = mqtt.connect(MQTT_BROKER, {
    clientId: e,
    clean: !0,
    reconnectPeriod: 3e3,
    connectTimeout: 1e4,
  })),
    mqttClient.on("connect", () => {
      (console.log("MQTT接続成功"),
        mqttClient.subscribe(mqttTopicUser(currentUser.id), { qos: 0 }, (e) => {
          e && console.error("MQTT subscribe user:", e);
        }),
        mqttClient.subscribe(mqttTopicGlobal(), { qos: 0 }, (e) => {
          e && console.error("MQTT subscribe global:", e);
        }));
    }),
    mqttClient.on("reconnect", () => {
      console.log("MQTT再接続中...");

      console.error("MQTT error:", e);
    }),
    mqttClient.on("offline", () => {

    }),

        console.error("MQTT message error:", e);
      }
    }));
}

async function adminBan(userId) {
  // 管理者チェック
  if (currentUser?.role !== "admin") {
    return void toast("管理者権限が必要です");
  }

  // ユーザーIDチェック
  if (!userId) {
    return void toast("ユーザーIDがありません");
  }

  // BAN時間入力
  const input = prompt("BAN時間（分）", "60");

  if (input === null) return;

  const minutes = Number(input);

  if (!Number.isFinite(minutes) || minutes < 1) {
    return void toast("BAN時間が正しくありません");
  }

  // BAN対象ユーザー取得
  const { data: user, error: userError } = await supabaseClient
    .from("users")
    .select("id, username")
    .eq("id", userId)
    .maybeSingle();

  if (userError) {
    console.error("BAN対象ユーザー取得:", userError);
    return void toast("ユーザー情報を取得できませんでした");
  }

  if (!user) {
    return void toast("ユーザーが見つかりません");
  }

  // BAN終了時刻
  const banUntil = new Date(
    Date.now() + 60 * minutes * 1000
  ).toISOString();

  // アカウントBAN
  const { error: banError } = await supabaseClient
    .from("users")
    .update({
      ban_until: banUntil,
    })
    .eq("id", userId);

  if (banError) {
    console.error("アカウントBAN:", banError);
    return void toast("BANに失敗しました");
  }

  // BAN対象ユーザーの端末情報を取得
  const { data: devices, error: deviceError } = await supabaseClient
    .from("user_devices")
    .select("device_hash, device_info")
    .eq("user_id", userId);

  if (deviceError) {
    console.error("ユーザー端末取得:", deviceError);
  }

  // device_hash単位で重複排除
  const uniqueDevices = [
    ...new Map(
      (devices || [])
        .filter((device) => device.device_hash)
        .map((device) => [
          device.device_hash,
          device,
        ])
    ).values(),
  ];

  // 端末BAN
  if (uniqueDevices.length) {
    const bannedDevices = uniqueDevices.map((device) => ({
      device_hash: device.device_hash,
      device_info: device.device_info ?? null,
      reason: `ユーザー「${user.username}」のBANに伴う端末BAN`,
      banned_by: currentUser.id,
    }));

    const { error: deviceBanError } = await supabaseClient
      .from("banned_devices")
      .upsert(bannedDevices, {
        onConflict: "device_hash",
      });

    if (deviceBanError) {
      console.error("端末BAN:", deviceBanError);

      toast(
        "アカウントをBANしましたが、端末BANの登録に失敗しました"
      );

      await adminUsers();
      return;
    }
  }

  // キャッシュから削除
  cache.users.delete(userId);

  // 自分自身をBANした場合
  if (userId === currentUser.id) {
    currentUser = null;

    safeRemove("chanpro_post_user");

    // MQTT切断
    if (mqttClient) {
      try {
        mqttClient.end(true);
      } catch {}

      mqttClient = null;
    }

    // DMチャンネル削除
    if (dmChannel) {
      try {
        await supabaseClient.removeChannel(dmChannel);
      } catch {}

      dmChannel = null;
    }

    // BAN反映のためリロード
    location.reload();
    return;
  }

  // 他ユーザーをBANした場合
  toast(`${user.username} を ${minutes}分BANしました`);

  await adminUsers();
}

async function sha256(e) {
  if (!window.crypto || !window.crypto.subtle)
    throw new Error("この環境ではcrypto.subtleが使用できません");
  const t = new TextEncoder().encode(e),
    n = await window.crypto.subtle.digest("SHA-256", t);
  return Array.from(new Uint8Array(n))
    .map((e) => e.toString(16).padStart(2, "0"))
    .join("");
}
function getLocalDeviceKey() {
  try {
    const e = window.localStorage.getItem("deviceKey");
    if (e) return e;
    const t = crypto.randomUUID();
    return (window.localStorage.setItem("deviceKey", t), t);
  } catch (e) {
    return null;
  }
}
function getSessionDeviceKey() {
  try {
    const e = window.sessionStorage.getItem("deviceKey");
    if (e) return e;
    const t = crypto.randomUUID();
    return (window.sessionStorage.setItem("deviceKey", t), t);
  } catch (e) {
    return null;
  }
}
function getDeviceKey() {
  const e = getLocalDeviceKey();
  if (e) return e;
  const t = getSessionDeviceKey();
  return t || null;
}
async function getDeviceHash() {

    t = getDeviceKey();

}
async function isDeviceBanned() {

        hash: null,
      };
    const { data: t, error: n } = await supabaseClient
      .from("banned_devices")
      .select("id, reason")
      .eq("device_hash", e)
      .maybeSingle();
    return n
      ? (console.error("端末BAN確認エラー:", n),
        { banned: !0, reason: "端末BANを確認できませんでした", hash: e })
      : t
        ? {
            banned: !0,
            reason: t.reason || "この端末は使用できません",
            hash: e,
          }
        : { banned: !1, reason: null, hash: e };
  } catch (e) {
    return (
      console.error("端末BAN確認失敗:", e),
      { banned: !0, reason: "端末確認に失敗しました", hash: null }
    );
  }
}
