<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f9fa;

}

button,input,textarea{

}

button{

}

.hidden{

}

.app{

}

.sidebar{

}

.logo{

.nav button{

.nav button:hover{

.composer input{

.composerBottom{

.profileActions{

.profileHandle{

}

.profileBio{

.profileStats div{

.notification{

.unread{

.dmList{

.dmUser{

.dmMessages{

.toast{

.profileStatClickable:hover b,

<script>

const SUPABASE_URL =
"https://ldnmqfmebvyzlmhgnljf.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_sJCCy8PpxucgNgweKh9jsA_BKne3v3U";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


let currentUser = null;
let currentDMUser = null;


/* =========================
   共通
========================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function avatarURL(url,size=100){

  return url ||
    `https://placehold.jp/${size}x${size}.png`;

}


function toast(message){

  $("toast").textContent = message;
  $("toast").classList.remove("hidden");

  setTimeout(()=>{
    $("toast").classList.add("hidden");
  },2500);

}


function openModal(html){

  $("modalContent").innerHTML = html;
  $("modal").classList.remove("hidden");

}


function closeModal(){

  $("modal").classList.add("hidden");

}


/* =========================
   sandbox対応ストレージ
========================= */


function safeGet(key){

  try{
    return localStorage.getItem(key);
  }catch(e){

    return null;

  }

}




function safeSet(key,value){

  try{

    localStorage.setItem(
      key,
      value
    );

    return true;

  }catch(e){

    return false;

  }

}



function safeRemove(key){

  try{
    localStorage.removeItem(key);
  }catch(e){}
}


/* =========================
   パスワード
========================= */

async function hashPassword(password){

  const data =
    new TextEncoder().encode(password);

  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  return Array.from(
    new Uint8Array(hash)
  )
  .map(x =>
    x.toString(16).padStart(2,"0")
  )
  .join("");

}


/* =========================
   アカウント
========================= */

async function login(){

  const username =
    $("loginName").value.trim();

  const password =
    $("loginPassword").value;

  if(!username || !password){

    $("loginError").textContent =
      "入力してください";

    return;
  }

  const passwordHash =
    await hashPassword(password);

  const {data,error} =
    await supabaseClient
      .from("users")
      .select("*")
      .eq("username",username)
      .eq("password_hash",passwordHash)
      .maybeSingle();

  if(error){

    console.error(error);

    $("loginError").textContent =
      error.message;

    return;
  }

  if(!data){

    $("loginError").textContent =
      "ユーザー名またはパスワードが違います";

    return;
  }

  if(
    data.ban_until &&
    new Date(data.ban_until) > new Date()
  ){

    $("loginError").textContent =
      "このアカウントはBANされています";

    return;
  }

  currentUser = data;

  safeSet(
    "chanpro_post_user",
    data.id
  );

  await afterLogin();

}


async function createAccount(){

  const username =
    $("loginName").value.trim();

  const password =
    $("loginPassword").value;

  if(!username || !password){

    $("loginError").textContent =
      "ユーザー名とパスワードを入力してください";

    return;
  }

  if(username.length < 2){

    $("loginError").textContent =
      "ユーザー名は2文字以上にしてください";

    return;
  }

  if(password.length < 6){

    $("loginError").textContent =
      "パスワードは6文字以上にしてください";

    return;
  }

  const passwordHash =
    await hashPassword(password);

  const {data,error} =
    await supabaseClient
      .from("users")
      .insert({

        username,
        password_hash:passwordHash,
        ban_count:0,
        ban_until:null,
        icon_url:"",
        profile:""

      })
      .select("*")
      .single();

  if(error){

    if(error.code === "23505"){

      $("loginError").textContent =
        "そのユーザー名はすでに使用されています";

    }else{

      $("loginError").textContent =
        error.message;

    }

    return;
  }

  currentUser = data;

  safeSet(
    "chanpro_post_user",
    data.id
  );

  await afterLogin();

}


async function afterLogin(){

  $("loginPage").classList.add("hidden");
  $("app").classList.remove("hidden");

  await loadHome();
  await loadTrends();
  await loadSuggestedUsers();
  await checkAdmin();

}


async function restoreLogin(){

  const id =
    safeGet("chanpro_post_user");

  if(!id) return;

  const {data,error} =
    await supabaseClient
      .from("users")
      .select("*")
      .eq("id",id)
      .maybeSingle();

  if(error || !data) return;

  if(
    data.ban_until &&
    new Date(data.ban_until) > new Date()
  ){

    safeRemove("chanpro_post_user");
    return;
  }

  currentUser = data;

  await afterLogin();

}


function logout(){

  currentUser = null;

  safeRemove(
    "chanpro_post_user"
  );

  location.reload();

}


/* =========================
   ページ
========================= */

function hidePages(){

  [
    "homePage",
    "searchPage",
    "notificationPage",
    "messagesPage",
    "profilePage",
    "bookmarksPage",
    "adminPage"
  ].forEach(id =>
    $(id).classList.add("hidden")
  );

}


async function showPage(page){

  hidePages();

  if(page === "home"){

    $("homePage").classList.remove("hidden");
    await loadHome();

  }

  if(page === "search"){

    $("searchPage").classList.remove("hidden");

  }

  if(page === "notifications"){

    $("notificationPage").classList.remove("hidden");
    await loadNotifications();

  }

  if(page === "messages"){

    $("messagesPage").classList.remove("hidden");
    await loadDMs();

  }

  if(page === "admin"){

    $("adminPage").classList.remove("hidden");
    await loadAdmin();

  }

}


/* =========================
   投稿
========================= */

function openPostModal(){

  openModal(`

    <h2>投稿</h2>

    <textarea
      id="modalPostText"
      placeholder="いまどうしてる？"
      style="width:100%;height:130px"
    ></textarea>

    <input
      id="modalPostImage"
      placeholder="画像URL（任意）"
    >

    <div style="text-align:right;margin-top:10px">

      <button
        class="secondary"
        onclick="closeModal()"
      >
        キャンセル
      </button>

      <button
        class="primary"
        onclick="submitPost()"
      >
        投稿
      </button>

    </div>

  `);

}


async function quickPost(){

  const text =
    $("quickPostText").value.trim();

  const image =
    $("quickPostImage").value.trim();

  await createPost(
    text,
    image
  );

  $("quickPostText").value="";
  $("quickPostImage").value="";

}


async function submitPost(){

  const text =
    $("modalPostText").value.trim();

  const image =
    $("modalPostImage").value.trim();

  await createPost(
    text,
    image
  );

  closeModal();

}


async function createPost(text,image){

  if(!text && !image){

    toast("投稿内容を入力してください");
    return;
  }

  if(image){

    try{

      const url =
        new URL(image);

      if(
        url.protocol !== "http:" &&
        url.protocol !== "https:"
      ){

        toast("画像URLが正しくありません");
        return;
      }

    }catch(e){

      toast("画像URLが正しくありません");
      return;
    }

  }

  const {data,error} =
    await supabaseClient
      .from("posts")
      .insert({

        user_id:currentUser.id,
        content:text,
        image_url:image || null

      })
      .select("*")
      .single();

  if(error){

    console.error(error);
    toast("投稿に失敗しました");
    return;
  }

  await extractHashtags(
    data.id,
    text
  );

  toast("投稿しました");

  await loadHome();

}


async function extractHashtags(postId,text){

  const tags =
    text.match(/#[\p{L}\p{N}_]+/gu) || [];

  const unique =
    [...new Set(
      tags.map(x =>
        x.substring(1).toLowerCase()
      )
    )];

  for(const tag of unique){

    await supabaseClient
      .from("hashtags")
      .upsert(
        {
          tag,
          updated_at:new Date().toISOString()
        },
        {
          onConflict:"tag"
        }
      );

    await supabaseClient
      .from("post_hashtags")
      .insert({
        post_id:postId,
        hashtag:tag
      });

  }

}


/* =========================
   投稿表示
========================= */

async function createPostElement(post){

  const user =
    await getUser(post.user_id);

  if(!user) return document.createElement("div");

  const article =
    document.createElement("article");

  article.className="post";

  const {count:likeCount} =
    await supabaseClient

      })

      .eq("post_id",post.id)

    await supabaseClient
      .from("replies")

      })
      .eq("post_id",post.id);

  const {count:repostCount} =
    await supabaseClient

        head:true
      })
      .eq("post_id",post.id);

          @${escapeHTML(user.username)}
          · ${formatDate(post.created_at)}
        </span>

        <div class="postText">${formatContent(post.content)}</div>

        ${
          post.image_url
          ?
          `
          <img
            class="postImage"
            src="${escapeHTML(post.image_url)}"
            onerror="this.style.display='none'"
          >
          `

          ""

            </button>

          }

      </div>

  return article;

}


function formatContent(text){

  let html =
    escapeHTML((text || "").trim());

  html =
    html.replace(
      /(^|\s)#([\p{L}\p{N}_]+)/gu,
      '$1<a href="#" onclick="searchHashtag(\'$2\');return false">#$2</a>'
    );

  html =
    html.replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>'
    );

  return html;

}


function formatDate(date){

  const d =
    new Date(date);

  return d.toLocaleString(
    "ja-JP",
    {
      month:"numeric",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

async function showFollowList(userId, type){

  if(!user) return;

  const isFollowers = type === "followers";

  const title = isFollowers
    ? "フォロワー"
    : "フォロー中";

  const column = isFollowers
    ? "following_id"
    : "follower_id";

  const {data, error} =
    await supabaseClient
      .from("follows")
      .select("follower_id, following_id")
      .eq(column, userId);

  if(error){

    console.error(error);

    openModal(`
      <h2>${title}</h2>

      <div class="empty">

  openModal(`

  `);

  const box = $("followList");

  if(!data || !data.length){

    box.innerHTML = `
      <div class="empty">

      </div>
    `;

    return;

  for(const item of data){

    const targetUserId =
      isFollowers
        ? item.follower_id
        : item.following_id;

    const targetUser =
      await getUser(targetUserId);

    if(!targetUser) continue;

    let isFollowing = false;

    if(targetUser.id !== currentUser.id){

      >

        </b>

        <div class="handle">
          @${escapeHTML(targetUser.username)}
        </div>

      </div>

${
  targetUser.id !== currentUser.id
  ?
  `
  <button
    class="${isFollowing ? "secondary" : "primary"}"
    onclick="toggleFollowFromList('${targetUser.id}','${userId}','${type}')"
  >
    ${isFollowing ? "フォロー中" : "フォロー"}
  </button>
  `
  :

}

    `;

    row.querySelector(".avatar").onclick = () => {

      closeModal();

      showUserProfile(

    row.querySelector(".userRowInfo").onclick = () => {

      closeModal();

    box.appendChild(row);

async function saveProfileEdit(){

  const username =
    $("editUsername").value.trim();

  const icon_url =
    $("editIcon").value.trim();

  const cover_url =
    $("editCover").value.trim();

  const profile =
    $("editBio").value.trim();

  if(!username){

    toast("ユーザー名を入力してください");
    return;

  }

  // アイコンURLのチェック
  if(icon_url){

    try{

      const url =
        new URL(icon_url);

      if(
        url.protocol !== "http:" &&
        url.protocol !== "https:"
      ){

        toast("アイコン画像URLが正しくありません");
        return;

      }

    }catch(e){

      toast("アイコン画像URLが正しくありません");
      return;

    }

  }

  // 背景URLのチェック
  if(cover_url){

    try{

      const url =
        new URL(cover_url);

      if(
        url.protocol !== "http:" &&
        url.protocol !== "https:"
      ){

        toast("背景画像URLが正しくありません");
        return;

      }

    }catch(e){

      toast("背景画像URLが正しくありません");
      return;

    }

  }

  const {data,error} =
    await supabaseClient
      .from("users")
      .update({
        username,
        icon_url,
        cover_url,
        profile
      })
      .eq("id",currentUser.id)
      .select("*")
      .single();

  if(error){

    console.error(error);

    toast(
      error.code==="23505"
        ?
        "そのユーザー名は使用されています"
        :
        "保存できませんでした"
    );

    return;

  }

  currentUser = data;

  closeModal();

  await showMyProfile();

  toast("プロフィールを保存しました");

}

async function loadDMs(){

  const box =
    $("dmContent");

  box.innerHTML =
    `<div class="empty">DM一覧を読み込み中...</div>`;

  /*
   * 自分が送ったDM・受け取ったDMを取得
   */
  const {data:messages,error} =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order("created_at",{
        ascending:false
      })
      .limit(200);

  if(error){

    console.error(error);

    box.innerHTML =
      `<div class="empty">DM一覧を取得できませんでした</div>`;

    return;
  }

  /*
   * 相手ごとに最新のDMだけ残す
   */
  const conversations =
    new Map();

  for(const message of messages || []){

    const otherUserId =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;

    if(!otherUserId) continue;

    /*
     * すでに最新DMが入っていれば追加しない
     */
    if(!conversations.has(otherUserId)){

      conversations.set(
        otherUserId,
        message
      );

    }

  }

  box.innerHTML = "";

  if(conversations.size === 0){

    box.innerHTML = `
      <div class="empty">
        まだDMはありません
      </div>
    `;

    return;
  }

  /*
   * DM一覧
   */
  for(
    const [userId,message]
    of conversations
  ){

    const user =
      await getUser(userId);

    if(!user) continue;

    const row =
      document.createElement("div");

    row.className =
      "userRow";

    row.style.cursor =
      "pointer";

    row.innerHTML = `

      <img
        class="avatar"
        src="${avatarURL(
          user.icon_url,
          50
        )}"
      >

      <div
        class="userRowInfo"
        style="flex:1"
      >

        <b>
          ${escapeHTML(user.username)}
        </b>

        <div
          class="handle"
          style="
            margin-top:4px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
          "
        >
          ${escapeHTML(
            message.content || ""
          )}
        </div>

        <div
          class="handle"
          style="margin-top:3px"
        >
          ${formatDate(
            message.created_at
          )}
        </div>

      </div>

    `;

    /*
     * 行をクリック → DM画面
     */
    row.onclick = () => {

      openDM(user.id);

    };

    box.appendChild(row);

  }

}

async function sendDM(){

  if(!currentDMUser) return;

  const input = $("dmInput");

  const content =
    input.value.trim();

  if(!content) return;

  const {data:message,error} =
    await supabaseClient
      .from("messages")
      .insert({

        sender_id:currentUser.id,
        receiver_id:currentDMUser.id,
        content

      })
      .select("*")
      .single();

  if(error){

    console.error(error);

    toast("DM送信失敗");

    return;
  }

  /*
   * DM通知
   */
  if(currentDMUser.id !== currentUser.id){

    const {error:notificationError} =
      await supabaseClient
        .from("notifications")
        .insert({

          user_id:currentDMUser.id,
          actor_id:currentUser.id,
          type:"message",
          message_id:message.id

        });

    if(notificationError){

      console.error(
        "DM通知作成失敗",
        notificationError
      );

    }

  }

  input.value = "";

  await openDM(
    currentDMUser.id
  );

}

            BAN
          </button>

          <button
            class="danger"
            onclick="adminDeleteUser('${user.id}')"
          >
            削除
          </button>

        </div>

      </div>

    `;

  }

}


async function adminChangeRole(userId){

  const role =
    prompt(
      "権限を入力：admin または user"
    );

  if(
    role !== "admin" &&
    role !== "user"
  ){

    return;
  }

  await supabaseClient
    .from("users")
    .update({
      role
    })
    .eq("id",userId);

  toast("権限を変更しました");

  await adminUsers();

}


async function adminBan(userId){

  const minutes =
    Number(
      prompt(
        "BAN時間（分）",
        "60"
      )
    );

  if(!minutes || minutes < 1)
    return;

  const until =
    new Date(
      Date.now() +
      minutes * 60 * 1000
    ).toISOString();

  const {error} =
    await supabaseClient
      .from("users")
      .update({
        ban_until:until
      })
      .eq("id",userId);

  if(error){

    console.error(error);
    toast("BAN失敗");
    return;
  }

  toast("BANしました");

}


async function adminDeleteUser(userId){

  if(
    !confirm(
      "このユーザーを削除しますか？"
    )
  ){

    return;
  }

  const {error} =
    await supabaseClient
      .from("users")
      .delete()
      .eq("id",userId);

  if(error){

    toast("削除失敗");
    console.error(error);
    return;
  }

  toast("ユーザーを削除しました");

  await adminUsers();

}

/* =========================
通知を作成
20件を超えたら古い通知を削除
========================= */

async function createNotification(notification){

  const {data,error} =
    await supabaseClient
      .from("notifications")
      .insert(notification)
      .select("id")
      .single();

  if(error){

    console.error(error);
    return null;

  }

  // このユーザーの通知を新しい順で取得
  const {data:notifications,error:listError} =
    await supabaseClient
      .from("notifications")
      .select("id")
      .eq("user_id",notification.user_id)
      .order("created_at",{
        ascending:false
      });

  if(listError){

    console.error(listError);
    return data;

  }

  // 20件を超えた分を削除
  if(notifications && notifications.length > 20){

    const oldNotifications =
      notifications.slice(20);

    const oldIds =
      oldNotifications.map(
        notification => notification.id
      );

    if(oldIds.length){

      const {error:deleteError} =
        await supabaseClient
          .from("notifications")
          .delete()
          .in("id",oldIds);

      if(deleteError){

        console.error(
          "古い通知の削除に失敗しました",
          deleteError
        );

      }

    }

  }

  return data;

}
