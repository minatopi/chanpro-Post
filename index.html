<style>

<script>
/* =========================================================
   chanpro-Post
   Supabase アクセス大幅削減版
   ========================================================= */

const SUPABASE_URL =
  "https://ldnmqfmebvyzlmhgnljf.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_sJCCy8PpxucgNgweKh9jsA_BKne3v3U";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   State
   ========================================================= */

let currentUser = null;
let currentDMUser = null;
let dmChannel = null;
let mqttClient = null;

const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";

const cache = {
  users: new Map(),
  posts: new Map(),
  follows: null,
  trends: null,
  suggestedUsers: null
};


/* =========================================================
   Basic helpers
   ========================================================= */

function $(id) {
  return document.getElementById(id);
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function avatarURL(url, size = 100) {
  return url ||
    `https://placehold.jp/${size}x${size}.png`;
}

function toast(message) {
  $("toast").textContent = message;
  $("toast").classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    $("toast").classList.add("hidden");
  }, 2500);
}

function openModal(html) {
  $("modalContent").innerHTML = html;
  $("modal").classList.remove("hidden");
}

function closeModal() {
  $("modal").classList.add("hidden");
}

function safeGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}

function safeSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch {
    return false;
  }
}

function safeRemove(key) {
  try {
    localStorage.removeItem(key);
  } catch {}
}

function formatDate(date) {
  const d = new Date(date);

  return d.toLocaleString("ja-JP", {
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}


/* =========================================================
   Password
   ========================================================= */

async function hashPassword(password) {
  const data = new TextEncoder().encode(password);

  const hash = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return Array.from(new Uint8Array(hash))
    .map(x => x.toString(16).padStart(2, "0"))
    .join("");
}


/* =========================================================
   User cache
   ========================================================= */


async function getUser(id) {
  if (!id) return null;

  // キャッシュにある古いユーザー情報を使わない
  cache.users.delete(id);

  const {
    data,
    error
  } = await supabaseClient
    .from("users")
    .select(`
      id,
      username,
      icon_url,
      cover_url,
      profile,
      role,
      ban_until,
      program_urls,
      program_views,
      program_likes
    `)
    .eq("id", id)
    .maybeSingle();

  if (error) {
    console.error("getUser:", error);
    return null;
  }

  if (data) {
    console.log("プロフィールデータ:", {
      username: data.username,
      program_urls: data.program_urls,
      program_views: data.program_views,
      program_likes: data.program_likes
    });

    cache.users.set(id, data);
  }

  return data;
}



async function getUsers(ids) {
  const uniqueIds = [
    ...new Set((ids || []).filter(Boolean))
  ];

  if (!uniqueIds.length) return [];

  const missingIds = uniqueIds.filter(
    id => !cache.users.has(id)
  );

  if (missingIds.length) {
    const { data, error } = await supabaseClient
      .from("users")
      .select(`
        id,
        username,
        icon_url,
        cover_url,
        profile,
        role,
        ban_until
      `)
      .in("id", missingIds);

    if (error) {
      console.error("getUsers:", error);
    } else {
      for (const user of data || []) {
        cache.users.set(user.id, user);
      }
    }
  }

  return uniqueIds
    .map(id => cache.users.get(id))
    .filter(Boolean);
}


/* =========================================================
   Login
   ========================================================= */

async function login() {
  const username = $("loginName").value.trim();
  const password = $("loginPassword").value;

  if (!username || !password) {
    $("loginError").textContent = "入力してください";
    return;
  }

  const passwordHash = await hashPassword(password);

  const { data, error } = await supabaseClient
    .from("users")
    .select(`
      id,
      username,
      icon_url,
      cover_url,
      profile,
      role,
      ban_until,
      program_urls
    `)
    .eq("username", username)
    .eq("password_hash", passwordHash)
    .maybeSingle();

  if (error) {
    console.error(error);
    $("loginError").textContent = error.message;
    return;
  }

  if (!data) {
    $("loginError").textContent =
      "ユーザー名またはパスワードが違います";
    return;
  }

  if (
    data.ban_until &&
    new Date(data.ban_until) > new Date()
  ) {
    $("loginError").textContent =
      "このアカウントはBANされています";
    return;
  }

  currentUser = data;
  cache.users.set(data.id, data);

  safeSet(
    "chanpro_post_user",
    data.id
  );

  await afterLogin();
}


async function createAccount() {
  const username = $("loginName").value.trim();
  const password = $("loginPassword").value;

  if (!username || !password) {
    $("loginError").textContent =
      "ユーザー名とパスワードを入力してください";
    return;
  }

  if (username.length < 2) {
    $("loginError").textContent =
      "ユーザー名は2文字以上にしてください";
    return;
  }

  if (password.length < 6) {
    $("loginError").textContent =
      "パスワードは6文字以上にしてください";
    return;
  }

  const passwordHash =
    await hashPassword(password);

  const { data, error } = await supabaseClient
    .from("users")
    .insert({
      username,
      password_hash: passwordHash,
      ban_count: 0,
      ban_until: null,
      icon_url: "",
      profile: "",
      role: "user"
    })
    .select(`
      id,
      username,
      icon_url,
      cover_url,
      profile,
      role,
      ban_until
    `)
    .single();

  if (error) {
    if (error.code === "23505") {
      $("loginError").textContent =
        "そのユーザー名はすでに使用されています";
    } else {
      $("loginError").textContent =
        error.message;
    }

    return;
  }

  currentUser = data;
  cache.users.set(data.id, data);

  safeSet(
    "chanpro_post_user",
    data.id
  );

  await afterLogin();
}


async function restoreLogin() {
  const id =
    safeGet("chanpro_post_user");

  if (!id) return;

  const user = await getUser(id);

  if (!user) return;

  if (
    user.ban_until &&
    new Date(user.ban_until) > new Date()
  ) {
    safeRemove("chanpro_post_user");
    return;
  }

  currentUser = user;

  await afterLogin();
}


async function afterLogin() {
  $("loginPage").classList.add("hidden");
  $("app").classList.remove("hidden");

  // MQTTリアルタイム通信開始
  connectMQTT();

  // DMのSupabase Realtime開始
  subscribeDMRealtime();

  await Promise.all([
    loadHome(),
    loadTrends(),
    loadSuggestedUsers()
  ]);

  checkAdmin();
}


function logout() {
  currentUser = null;

  cache.users.clear();
  cache.posts.clear();
  cache.follows = null;
  cache.trends = null;
  cache.suggestedUsers = null;

  safeRemove("chanpro_post_user");

  location.reload();
}


/* =========================================================
   Navigation
   ========================================================= */

function hidePages() {
  [
    "homePage",
    "searchPage",
    "notificationPage",
    "messagesPage",
    "profilePage",
    "bookmarksPage",
    "adminPage"
  ].forEach(id => {
    $(id).classList.add("hidden");
  });
}


async function showPage(page) {
  hidePages();

  if (page === "home") {
    $("homePage").classList.remove("hidden");
    await loadHome();
  }

  if (page === "search") {
    $("searchPage").classList.remove("hidden");
  }

  if (page === "notifications") {
    $("notificationPage").classList.remove("hidden");
    await loadNotifications();
  }

  if (page === "messages") {
    $("messagesPage").classList.remove("hidden");
    await loadDMs();
  }

  if (page === "admin") {
    $("adminPage").classList.remove("hidden");
    await loadAdmin();
  }
}


/* =========================================================
   Post creation
   ========================================================= */

function openPostModal() {
  openModal(`
    <h2>投稿</h2>

    <textarea
      id="modalPostText"
      placeholder="いまどうしてる？"
      style="width:100%;height:130px"
    ></textarea>

    <input
      id="modalPostImage"
      placeholder="画像URL（任意）"
    >

    <div style="text-align:right;margin-top:10px">
      <button
        class="secondary"
        onclick="closeModal()"
      >

async function createPost(text, image) {
  if (!text && !image) {
    toast("投稿内容を入力してください");
    return;
  }

  if (image) {
    try {
      const url = new URL(image);
      if (url.protocol !== "http:" && url.protocol !== "https:") {
        toast("画像URLが正しくありません");
        return;
      }
    } catch {
      toast("画像URLが正しくありません");
      return;
    }
  }

  const { data, error } = await supabaseClient
    .from("posts")
    .insert({
      user_id: currentUser.id,
      content: text,
      image_url: image || null
    })
    .select(`
      id,
      user_id,
      content,
      image_url,
      created_at
    `)
    .single();

  if (error) {
    console.error(error);
    toast("投稿に失敗しました");
    return;
  }

  cache.posts.set(data.id, data);

  await extractHashtags(data.id, text);

  // フォロワーへ「新規投稿」通知
  await notifyFollowersAboutPost(data.id);

  // MQTTで全体へ新規投稿イベントを通知
  mqttPublish(mqttTopicGlobal(), {
    type: "post_created",
    post_id: data.id,
    user_id: currentUser.id
  });

  toast("投稿しました");
  await loadHome();
}



/* =========================================================
   Hashtags
   ========================================================= */

async function extractHashtags(
  postId,
  text
) {
  const tags =
    text.match(
      /#[\p{L}\p{N}_]+/gu
    ) || [];

  const unique = [
    ...new Set(
      tags.map(
        x => x.substring(1).toLowerCase()
      )
    )
  ];

  if (!unique.length) return;

  /*
   * hashtagsは一括upsert
   */
  await supabaseClient
    .from("hashtags")
    .upsert(
      unique.map(tag => ({
        tag,
        updated_at:
          new Date().toISOString()
      })),
      {
        onConflict: "tag"
      }
    );

  /*
   * post_hashtagsも一括insert
   */
  await supabaseClient
    .from("post_hashtags")
    .insert(
      unique.map(hashtag => ({
        post_id: postId,
        hashtag
      }))
    );

  cache.trends = null;
}


/* =========================================================
   Content
   ========================================================= */

function formatContent(text) {
  let html =
    escapeHTML(
      (text || "").trim()
    );

  html = html.replace(
    /(^|\s)#([\p{L}\p{N}_]+)/gu,
    '$1<a href="#" onclick="searchHashtag(\'$2\');return false">#$2</a>'
  );

  html = html.replace(
    /(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>'
  );

  return html;
}


/* =========================================================
   Batch post metadata
   ========================================================= */

async function getPostMeta(postIds) {
  const ids = [
    ...new Set(postIds)
  ];

  if (!ids.length) {
    return {
      likes: new Map(),
      replies: new Map(),
      reposts: new Map(),
      bookmarks: new Set(),
      myLikes: new Set(),
      myReposts: new Set()
    };
  }

  /*
   * ここが今回の大幅削減ポイント。
   *
   * 旧:
   *   投稿1 → 7アクセス
   *   投稿2 → 7アクセス
   *   投稿3 → 7アクセス
   *   ...
   *
   * 新:
   *   likes
   *   replies
   *   reposts
   *   bookmarks
   *
   * をまとめて取得。
   */

  const [
    likesResult,
    repliesResult,
    repostsResult,
    bookmarksResult
  ] = await Promise.all([
    supabaseClient
      .from("likes")
      .select("post_id,user_id")
      .in("post_id", ids),

    supabaseClient
      .from("replies")
      .select("post_id")
      .in("post_id", ids),

    supabaseClient
      .from("reposts")
      .select("post_id,user_id")
      .in("post_id", ids),

    supabaseClient
      .from("bookmarks")
      .select("post_id,user_id")
      .in("post_id", ids)
      .eq("user_id", currentUser.id)
  ]);

  const likes =
    new Map();

  const replies =
    new Map();

  const reposts =
    new Map();

  const bookmarks =
    new Set();

  const myLikes =
    new Set();

  const myReposts =
    new Set();

  for (const row of likesResult.data || []) {
    likes.set(
      row.post_id,
      (likes.get(row.post_id) || 0) + 1
    );

    if (
      row.user_id === currentUser.id
    ) {
      myLikes.add(row.post_id);
    }
  }

  for (const row of repliesResult.data || []) {
    replies.set(
      row.post_id,
      (replies.get(row.post_id) || 0) + 1
    );
  }

  for (const row of repostsResult.data || []) {
    reposts.set(
      row.post_id,
      (reposts.get(row.post_id) || 0) + 1
    );

    if (
      row.user_id === currentUser.id
    ) {
      myReposts.add(row.post_id);
    }
  }

  for (const row of bookmarksResult.data || []) {
    bookmarks.add(row.post_id);
  }

  return {
    likes,
    replies,
    reposts,
    bookmarks,
    myLikes,
    myReposts
  };
}

  return article;
}

async function loadHome() {
  const box = $("homePosts");

  box.innerHTML =
    `<div class="empty">読み込み中...</div>`;

  /*
   * 100 → 50
   * 最初の通信量を半分程度に。
   */
  const {
    data: posts,
    error
  } = await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      image_url,
      created_at
    `)
    .order("created_at", {
      ascending: false
    })
    .limit(50);

  if (error) {
    console.error(error);

    box.innerHTML =
      `<div class="empty">
        読み込みに失敗しました
      </div>`;

    return;
  }

  if (!posts || !posts.length) {
    box.innerHTML =
      `<div class="empty">
        まだ投稿がありません
      </div>`;

    return;
  }

  /*
   * ユーザーを一括取得
   */
  const userIds =
    posts.map(post => post.user_id);

  const users =
    await getUsers(userIds);

  const userMap =
    new Map(
      users.map(user => [
        user.id,
        user
      ])
    );

  /*
   * リアクションを一括取得
   */
  const meta =
    await getPostMeta(
      posts.map(post => post.id)
    );

  box.innerHTML = "";

  for (const post of posts) {
    const user =
      userMap.get(post.user_id);

    if (!user) continue;

    cache.posts.set(
      post.id,
      post
    );

    box.appendChild(
      createPostElement(
        post,
        user,
        meta
      )
    );
  }
}

async function showFollowList(
  userId,
  type
) {
  const user =
    await getUser(userId);

  if (!user) return;

  const isFollowers =
    type === "followers";

  const title =
    isFollowers
      ? "フォロワー"
      : "フォロー中";

  const column =
    isFollowers
      ? "following_id"
      : "follower_id";

  const {
    data,
    error
  } = await supabaseClient
    .from("follows")
    .select(`
      follower_id,
      following_id
    `)
    .eq(column, userId);

  if (error) {
    console.error(error);

    openModal(`
      <h2>${title}</h2>
      <div class="empty">
        一覧を取得できませんでした
      </div>
    `);

    return;
  }

  openModal(`
    <h2>
      ${escapeHTML(user.username)}
      の${title}
    </h2>

    <div id="followList"></div>
  `);

  const box =
    $("followList");

  if (!data?.length) {
    box.innerHTML =
      `<div class="empty">
        ${title}はいません
      </div>`;

    return;
  }

  const targetIds =
    data.map(item =>
      isFollowers
        ? item.follower_id
        : item.following_id
    );

  /*
   * ユーザーを一括取得
   */
  const users =
    await getUsers(targetIds);

  const userMap =
    new Map(
      users.map(user => [
        user.id,
        user
      ])
    );

  /*
   * 自分がフォローしている人を一括取得
   */
  const {
    data: myFollows
  } = await supabaseClient
    .from("follows")
    .select("following_id")
    .eq(
      "follower_id",
      currentUser.id
    )
    .in(
      "following_id",
      targetIds
    );

  const followingSet =
    new Set(
      (myFollows || [])
        .map(x => x.following_id)
    );

  for (const item of data) {
    const targetUserId =
      isFollowers
        ? item.follower_id
        : item.following_id;

    const targetUser =
      userMap.get(targetUserId);

    if (!targetUser) continue;

    const isFollowing =
      followingSet.has(
        targetUser.id
      );

    const row =
      document.createElement("div");

    row.className = "userRow";

    row.innerHTML = `
      <img
        class="avatar"
        src="${avatarURL(
          targetUser.icon_url,
          45
        )}"
        style="cursor:pointer"
      >

      <div
        class="userRowInfo"
        style="cursor:pointer"
      >
        <b>
          ${escapeHTML(
            targetUser.username
          )}
        </b>

        <div class="handle">
          @${escapeHTML(
            targetUser.username
          )}
        </div>
      </div>

      ${
        targetUser.id !== currentUser.id
          ? `
            <button
              class="${
                isFollowing
                  ? "secondary"
                  : "primary"
              }"
            >
              ${
                isFollowing
                  ? "フォロー中"
                  : "フォロー"
              }
            </button>
          `
          : ""
      }
    `;

    row.querySelector(
      ".avatar"
    ).onclick = () => {
      closeModal();
      showUserProfile(
        targetUser.id
      );
    };

    row.querySelector(
      ".userRowInfo"
    ).onclick = () => {
      closeModal();
      showUserProfile(
        targetUser.id
      );
    };

    const button =
      row.querySelector("button");

    if (button) {
      button.onclick = async () => {
        await toggleFollowFromList(
          targetUser.id,
          userId,
          type
        );
      };
    }

    box.appendChild(row);
  }
}


async function toggleFollowFromList(
  targetUserId,
  profileUserId,
  type
) {
  await toggleFollow(
    targetUserId,
    false
  );

  await showFollowList(
    profileUserId,
    type
  );
}


async function toggleFollow(
  userId,
  reloadProfile = true
) {
  if (userId === currentUser.id) {
    return;
  }

  const {
    data
  } = await supabaseClient
    .from("follows")
    .select("id")
    .eq(
      "follower_id",
      currentUser.id
    )
    .eq(
      "following_id",
      userId
    )
    .maybeSingle();

  if (data) {
    await supabaseClient
      .from("follows")
      .delete()
      .eq("id", data.id);

    toast("フォローを解除しました");
  } else {
    await supabaseClient
      .from("follows")
      .insert({
        follower_id: currentUser.id,
        following_id: userId
      });

    await createNotification({
      user_id: userId,
      actor_id: currentUser.id,
      type: "follow"
    });

    toast("フォローしました");
  }

  cache.suggestedUsers = null;

  if (reloadProfile) {
    await showUserProfile(userId);
  }
}

function validProgramUrl(value) {
  if (!value) return true;

  try {
    const url = new URL(value);

    return (
      url.protocol === "https:" &&
      url.hostname === "chanpro.jp" &&
      url.pathname.startsWith("/00-program-profile/")
    );
  } catch {
    return false;
  }
}

function validHttpUrl(value) {
  if (!value) return true;

  try {
    const url =
      new URL(value);

    return (
      url.protocol === "http:" ||
      url.protocol === "https:"
    );
  } catch {
    return false;
  }
}



async function saveProfileEdit() {
  const username = $("editUsername").value.trim();
  const icon_url = $("editIcon").value.trim();
  const cover_url = $("editCover").value.trim();
  const profile = $("editBio").value.trim();
  const programUrl = $("editProgramUrl").value.trim();

  // =========================
  // 基本入力チェック
  // =========================
  if (!username) {
    toast("ユーザー名を入力してください");
    return;
  }

  // =========================
  // アイコンURLチェック
  // =========================
  if (!validHttpUrl(icon_url)) {
    toast("アイコン画像URLが正しくありません");
    return;
  }

  // =========================
  // 背景画像URLチェック
  // =========================
  if (!validHttpUrl(cover_url)) {
    toast("背景URLが正しくありません");
    return;
  }

  // =========================
  // プログラムURLチェック
  // 空欄は許可
  // =========================
  if (programUrl && !validProgramUrl(programUrl)) {
    toast("chanpro.jpのプログラムプロフィールURLを入力してください");
    return;
  }

  // =========================
  // text[] に保存
  // 1ユーザーにつき1URL
  // =========================
  const program_urls = programUrl
    ? [programUrl]
    : [];

  // =========================
  // Supabaseへ保存
  // =========================
  const { data, error } = await supabaseClient
    .from("users")
    .update({
      username,
      icon_url,
      cover_url,
      profile,
      program_urls
    })
    .eq("id", currentUser.id)
    .select(`
      id,
      username,
      icon_url,
      cover_url,
      profile,
      program_urls,
      role,
      ban_until
    `)
    .single();

  // =========================
  // 保存エラー
  // =========================
  if (error) {
    console.error("saveProfileEdit:", error);

    if (error.code === "23505") {
      toast("そのユーザー名は使用されています");
    } else {
      toast("プロフィールを保存できませんでした");
    }

    return;
  }

  // =========================
  // 現在のユーザー情報を更新
  // =========================
  currentUser = data;
  cache.users.set(data.id, data);

  // =========================
  // モーダルを閉じる
  // =========================
  closeModal();

  // =========================
  // プロフィールを再表示
  // =========================
  await showMyProfile();

  toast("プロフィールを保存しました");
}

async function notifyFollowersAboutPost(postId) {
  // 投稿IDがない場合は処理しない
  if (!postId) {
    console.warn("notifyFollowersAboutPost: postIdがありません");
    return;
  }

  // ログインユーザーがいない場合は処理しない
  if (!currentUser?.id) {
    console.warn("notifyFollowersAboutPost: currentUserがありません");
    return;
  }

  try {
    // ==========================================
    // 1. 自分をフォローしているユーザーを取得
    // ==========================================
    const { data: followers, error: followersError } =
      await supabaseClient
        .from("follows")
        .select("follower_id")
        .eq("following_id", currentUser.id);

    if (followersError) {
      console.error(
        "notifyFollowersAboutPost: フォロワー取得失敗",
        followersError
      );
      return;
    }

    if (!followers?.length) {
      console.log(
        "notifyFollowersAboutPost: フォロワーはいません"
      );
      return;
    }

    // ==========================================
    // 2. 自分自身を除外
    // ==========================================
    const followerIds = [
      ...new Set(
        followers
          .map(row => row.follower_id)
          .filter(
            userId =>
              userId &&
              userId !== currentUser.id
          )
      )
    ];

    if (!followerIds.length) {
      return;
    }

    // ==========================================
    // 3. 通知データを作成
    // ==========================================
    const notifications = followerIds.map(userId => ({
      user_id: userId,
      actor_id: currentUser.id,
      type: "post",
      post_id: postId
    }));

    // ==========================================
    // 4. Supabaseに一括保存
    // ==========================================
    const { error: notificationError } =
      await supabaseClient
        .from("notifications")
        .insert(notifications);

    if (notificationError) {
      console.error(
        "notifyFollowersAboutPost: 通知保存失敗",
        notificationError
      );
    }

    // ==========================================
    // 5. MQTTで各フォロワーへリアルタイム通知
    // ==========================================
    for (const followerId of followerIds) {
      mqttPublish(
        mqttTopicUser(followerId),
        {
          type: "post_created",
          post_id: postId,
          user_id: currentUser.id
        }
      );
    }

    console.log(
      `投稿通知送信完了: ${followerIds.length}人`,
      {
        postId,
        userId: currentUser.id,
        followerIds
      }
    );

  } catch (error) {
    console.error(
      "notifyFollowersAboutPost: 予期しないエラー",
      error
    );
  }
}


async function createNotificationForPost(
  postId,
  type
) {
  const post =
    cache.posts.get(postId);

  let targetUserId =
    post?.user_id;

  if (!targetUserId) {
    const { data } =
      await supabaseClient
        .from("posts")
        .select("user_id")
        .eq("id", postId)
        .maybeSingle();

    targetUserId =
      data?.user_id;
  }

  if (!targetUserId) return;

  if (
    targetUserId ===
    currentUser.id
  ) {
    return;
  }

  await createNotification({
    user_id: targetUserId,
    actor_id: currentUser.id,
    type,
    post_id: postId
  });
}


async function createNotification(
  notification
) {
  const {
    data,
    error
  } = await supabaseClient
    .from("notifications")
    .insert(notification)
    .select("id")
    .single();

  if (error) {
    console.error(
      "notification:",
      error
    );

    return null;
  }

  /*
   * 20件を超えた時だけ古い通知を削除。
   */
  const {
    data: notifications
  } = await supabaseClient
    .from("notifications")
    .select("id")
    .eq(
      "user_id",
      notification.user_id
    )
    .order("created_at", {
      ascending: false
    })
    .range(20, 100);

  const oldIds =
    (notifications || [])
      .map(x => x.id);

  if (oldIds.length) {
    await supabaseClient
      .from("notifications")
      .delete()
      .in("id", oldIds);
  }

  return data;
}

      id,
      user_id,
      actor_id,
      type,
      post_id,
      message_id,
      created_at

      "user_id",

    box.innerHTML =
      `<div class="empty">

      actors.map(user => [

      .from("messages")
      .select(`

        content

      new Map(
        (messages || []).map(
          message => [
            message.id,
            message
          ]
        )
      );
  }

  box.innerHTML = "";

  for (const n of data) {
    const actor =
      actorMap.get(n.actor_id);

    if (n.type === "message") {
      const message =
        messageMap.get(
          n.message_id
        );

      const notification =
        document.createElement("div");

      notification.className =
        "notification";

      notification.innerHTML = `
        <div
          style="cursor:pointer"

            openDMFromNotification(
              '${actor?.id || ""}'
            )
          "
        >

          <b>
            ${escapeHTML(
              actor?.username ||
              "ユーザー"
            )}
          </b>

          <span>
            からDMが届きました
          </span>

          ${
            message
              ? `
                <div
                  style="
                    margin-top:6px;
                    padding:10px;
                    background:#f5f8fa;
                    border-radius:10px;
                  "
                >
                  ${escapeHTML(
                    message.content
                  )}
                </div>
              `
              : ""
          }

          <div class="handle">
            ${formatDate(n.created_at)}
          </div>

        </div>
      `;

      box.appendChild(
        notification
      );

      continue;
    }

        
    
    let text = "通知";
    
    if (n.type === "like") {
      text = "あなたの投稿にいいねしました";
    }
    
    if (n.type === "reply") {
      text = "あなたの投稿に返信しました";
    }
    
    if (n.type === "repost") {
      text = "あなたの投稿をリポストしました";
    }
    
    if (n.type === "follow") {
      text = "あなたをフォローしました";
    }
    
    if (n.type === "post") {
      text = "新しい投稿をしました";
    }
    
    const notification = document.createElement("div");
    notification.className = "notification";
    
    const clickable =
      (n.type === "reply" || n.type === "post") && n.post_id;
    
    notification.innerHTML = `
      <div
        ${clickable
          ? `style="cursor:pointer"
             onclick="openReplyFromNotification('${n.post_id}')"`
          : ""}
      >
        <b>${escapeHTML(actor?.username || "ユーザー")}</b>
        ${escapeHTML(text)}
    
        <div class="handle">
          ${formatDate(n.created_at)}
        </div>
      </div>
    `;
    
    box.appendChild(notification);


  }
}

function mqttTopicUser(userId) {
    return `chanpro-post/user/${userId}`;
}

function mqttTopicGlobal() {
    return "chanpro-post/global";
}

function connectMQTT() {
    if (!currentUser) return;

    // 既存接続があれば終了
    if (mqttClient) {
        try {
            mqttClient.end(true);
        } catch {}
        mqttClient = null;
    }

    const clientId =
        `chanpro-post-${currentUser.id}-${Date.now()}-${Math.random()
            .toString(16)
            .slice(2)}`;

    mqttClient = mqtt.connect(MQTT_BROKER, {
        clientId,
        clean: true,
        reconnectPeriod: 3000,
        connectTimeout: 10000
    });

    mqttClient.on("connect", () => {
        console.log("MQTT接続成功");

        // 自分宛てのイベント
        mqttClient.subscribe(
            mqttTopicUser(currentUser.id),
            { qos: 0 },
            (error) => {
                if (error) {
                    console.error("MQTT subscribe user:", error);
                } else {
                    console.log(
                        "MQTT購読:",
                        mqttTopicUser(currentUser.id)
                    );
                }
            }
        );

        // 投稿・いいね等の全体イベント
        mqttClient.subscribe(
            mqttTopicGlobal(),
            { qos: 0 },
            (error) => {
                if (error) {
                    console.error("MQTT subscribe global:", error);
                } else {
                    console.log(
                        "MQTT購読:",
                        mqttTopicGlobal()
                    );
                }
            }
        );
    });

    mqttClient.on("reconnect", () => {
        console.log("MQTT再接続中...");
    });

    mqttClient.on("error", (error) => {
        console.error("MQTT error:", error);
    });

    mqttClient.on("offline", () => {
        console.log("MQTT offline");
    });

    mqttClient.on("message", async (topic, payload) => {
        try {
            const event = JSON.parse(payload.toString());

            console.log("MQTT受信:", topic, event);

            await handleMQTTEvent(event);
        } catch (error) {
            console.error("MQTT message error:", error);
        }
    });
}

function mqttPublish(topic, event) {
    if (!mqttClient) return;

    if (!mqttClient.connected) {
        console.log("MQTT未接続のため送信をスキップ");
        return;
    }

    mqttClient.publish(
        topic,
        JSON.stringify(event),
        {
            qos: 0,
            retain: false
        }
    );
}

async function handleMQTTEvent(event) {
    if (!currentUser) return;

    // =========================
    // DM
    // =========================
    if (event.type === "message") {
        if (!event.message_id) return;

        // 自分が送ったDMは無視
        if (event.sender_id === currentUser.id) {
            return;
        }

        // 自分宛てでなければ無視
        if (event.receiver_id !== currentUser.id) {
            return;
        }

        // 現在開いているDMの相手から届いた場合
        if (
            currentDMUser &&
            currentDMUser.id === event.sender_id &&
            $("dmMessages")
        ) {
            const { data: message, error } =
                await supabaseClient
                    .from("messages")
                    .select(`
                        id,
                        sender_id,
                        receiver_id,
                        content,
                        created_at
                    `)
                    .eq("id", event.message_id)
                    .maybeSingle();

            if (error) {
                console.error("DM取得:", error);
                return;
            }

            if (!message) return;

            // 重複表示防止
            const exists = document.querySelector(
                `[data-dm-message-id="${message.id}"]`
            );

            if (exists) return;

            appendDMMessage(message);

            const messagesBox = $("dmMessages");

            if (messagesBox) {
                messagesBox.scrollTop =
                    messagesBox.scrollHeight;
            }

            toast("新しいDM");
        }

        // DM一覧なら即更新
        if (
            !$("messagesPage")
                .classList
                .contains("hidden") &&
            !currentDMUser
        ) {
            await loadDMs();
        }

        return;
    }

    // =========================
    // 新規投稿
    // =========================
    if (event.type === "post_created") {
        if (
            !$("homePage")
                .classList
                .contains("hidden")
        ) {
            await loadHome();
        }

        return;
    }

    // =========================
    // 投稿削除
    // =========================
    if (event.type === "post_deleted") {
        cache.posts.delete(event.post_id);

        if (
            !$("homePage")
                .classList
                .contains("hidden")
        ) {
            await loadHome();
        }

        return;
    }

    // =========================
    // フォロー
    // =========================
    if (event.type === "follow") {
        cache.suggestedUsers = null;

        if (
            !$("profilePage")
                .classList
                .contains("hidden")
        ) {
            await showUserProfile(currentUser.id);
        }

        return;
    }

    // =========================
    // いいね・リポスト
    // =========================
    if (
        event.type === "like" ||
        event.type === "repost"
    ) {
        if (
            !$("homePage")
                .classList
                .contains("hidden")
        ) {
            await loadHome();
        }

        return;
    }
}

function subscribeDMRealtime() {
    if (dmChannel) {
        supabaseClient.removeChannel(dmChannel);
        dmChannel = null;
    }

    if (!currentUser) return;

    dmChannel = supabaseClient
        .channel(`dm-realtime-${currentUser.id}`)
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages",
                filter: `receiver_id=eq.${currentUser.id}`
            },
            async (payload) => {
                const message = payload.new;

                // DM画面を開いている相手からのメッセージなら即表示
                if (
                    currentDMUser &&
                    message.sender_id === currentDMUser.id &&
                    $("dmMessages")
                ) {
                    appendDMMessage(message);

                    const messagesBox = $("dmMessages");
                    messagesBox.scrollTop = messagesBox.scrollHeight;
                }

                // DM一覧を開いている場合は更新
                if (
                    !$("messagesPage").classList.contains("hidden") &&
                    !currentDMUser
                ) {
                    await loadDMs();
                }

                // 通知ページを開いている場合も更新
                if (
                    !$("notificationPage").classList.contains("hidden")
                ) {
                    await loadNotifications();
                }
            }
        )
        .subscribe((status) => {
            console.log("DM Realtime:", status);
        });
}

async function loadDMs() {
  currentDMUser = null;

  const box=$("dmContent");

  box.innerHTML =
    `<div class="empty">
      DM一覧を読み込み中...
    </div>`;

  const {
    data: messages,
    error
  } = await supabaseClient
    .from("messages")
    .select(`
      id,
      sender_id,
      receiver_id,
      content,
      created_at
    `)
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    )
    .order("created_at", {
      ascending: false
    })
    .limit(200);

  if (error) {
    console.error(error);

    box.innerHTML =
      `<div class="empty">
        DM一覧を取得できませんでした
      </div>`;

    return;
  }

  const conversations =
    new Map();

  for (const message of messages || []) {
    const otherUserId =
      message.sender_id ===
      currentUser.id
        ? message.receiver_id
        : message.sender_id;

    if (!otherUserId) continue;

    if (
      !conversations.has(
        otherUserId
      )
    ) {
      conversations.set(
        otherUserId,
        message
      );
    }
  }

  if (!conversations.size) {
    box.innerHTML =
      `<div class="empty">
        まだDMはありません
      </div>`;

    return;
  }

  const users =
    await getUsers(
      [...conversations.keys()]
    );

  const userMap =
    new Map(
      users.map(user => [
        user.id,
        user
      ])
    );

  box.innerHTML = "";

  for (
    const [
      userId,
      message
    ] of conversations
  ) {
    const user =
      userMap.get(userId);

    if (!user) continue;

    const row =
      document.createElement("div");

    row.className =
      "userRow";

    row.style.cursor =
      "pointer";

    row.innerHTML = `
      <img
        class="avatar"
        src="${avatarURL(
          user.icon_url,
          50
        )}"
      >

      <div
        class="userRowInfo"
        style="flex:1"
      >
        <b>
          ${escapeHTML(
            user.username
          )}
        </b>

        <div
          class="handle"
          style="
            margin-top:4px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
          "
        >
          ${escapeHTML(
            message.content || ""
          )}
        </div>

        <div
          class="handle"
          style="margin-top:3px"
        >
          ${formatDate(
            message.created_at
          )}
        </div>
      </div>
    `;

    row.onclick = () =>
      openDM(user.id);

    box.appendChild(row);
  }
}

function appendDMMessage(message) {
    const messagesBox = $("dmMessages");
    if (!messagesBox) return;

    // 同じメッセージを二重表示しない
    if (message.id) {
        const existing = document.querySelector(
            `[data-dm-message-id="${message.id}"]`
        );

        if (existing) return;
    }

    const isMine =
        message.sender_id === currentUser.id;

    const div = document.createElement("div");

    if (message.id) {
        div.dataset.dmMessageId = message.id;
    }

  div.style.cssText = `
    margin:6px 0;
    padding:10px 14px;
    border-radius:18px;
    max-width:75%;
    width:fit-content;
    white-space:pre-wrap;
    word-break:break-word;
    ${
      isMine
        ? `
          margin-left:auto;
          background:#1d9bf0;
          color:white;
        `
        : `
          margin-right:auto;
          background:#eff3f4;
          color:#0f1419;
        `
    }
  `;

  div.textContent =
    message.content;

  messagesBox.appendChild(div);
}


async function sendDM() {
    if (!currentDMUser) return;

    const input = $("dmInput");
    const content = input.value.trim();

    if (!content) return;

    const { data: message, error } =
        await supabaseClient
            .from("messages")
            .insert({
                sender_id: currentUser.id,
                receiver_id: currentDMUser.id,
                content
            })
            .select(`
                id,
                sender_id,
                receiver_id,
                content,
                created_at
            `)
            .single();

    if (error) {
        console.error(error);
        toast("DM送信失敗");
        return;
    }

    // 自分の画面には即表示
    appendDMMessage(message);

    // 相手へMQTT通知
    mqttPublish(
        mqttTopicUser(currentDMUser.id),
        {
            type: "message",
            message_id: message.id,
            sender_id: currentUser.id,
            receiver_id: currentDMUser.id
        }
    );

    // 通知もDBに保存
    if (currentDMUser.id !== currentUser.id) {
        await supabaseClient
            .from("notifications")
            .insert({
                user_id: currentDMUser.id,
                actor_id: currentUser.id,
                type: "message",
                message_id: message.id
            });
    }

    input.value = "";

    const messagesBox = $("dmMessages");

    if (messagesBox) {
        messagesBox.scrollTop =
            messagesBox.scrollHeight;
    }
}

async function loadTrends() {
  const box =
    $("trends");

  /*
   * ログイン中に何度も取得しない。
   */
  if (cache.trends) {
    renderTrends(
      cache.trends
    );
    return;
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("post_hashtags")
    .select("hashtag")
    .limit(1000);

  if (error) {
    console.error(error);

    box.innerHTML =
      `<div class="empty">
        トレンドを取得できませんでした
      </div>`;

    return;
  }

  const counts =
    new Map();

  for (const row of data || []) {
    counts.set(
      row.hashtag,
      (counts.get(row.hashtag) || 0) + 1
    );
  }

  const trends =
    [...counts.entries()]
      .map(([tag, count]) => ({
        tag,
        count
      }))
      .sort(
        (a, b) =>
          b.count - a.count
      )
      .slice(0, 3);

  cache.trends =
    trends;

  renderTrends(
    trends
  );
}


function renderTrends(trends) {
  const box =
    $("trends");

  box.innerHTML = "";

  if (!trends?.length) {
    box.innerHTML =
      `<div class="empty">
        まだトレンドがありません
      </div>`;

    return;
  }

  for (const trend of trends) {
    const row =
      document.createElement("div");

    row.className =
      "trend";

    row.innerHTML = `
      <b>
        #${escapeHTML(
          trend.tag
        )}
      </b>

      <small>
        ${trend.count}件の投稿
      </small>
    `;

    row.onclick = () =>
      searchHashtag(
        trend.tag
      );

    box.appendChild(row);
  }
}

    .from("follows")
    .select("following_id")
    .eq(
      "follower_id",
      currentUser.id
    )
    .in(
      "following_id",
      users.map(user => user.id)
    );

    new Set(

    );

          )}

          @${escapeHTML(
            user.username
          )}

            : "primary"
        }"
      >
        ${
          isFollowing
            ? "フォロー中"
            : "フォロー"
        }
      </button>
    `;

      ".avatar"
    ).onclick = () =>

      <hr>

      <button
        class="primary"
        onclick="adminUsers()"
      >
        ユーザー管理
      </button>

      <button
        class="secondary"
        onclick="adminPosts()"
      >
        投稿管理
      </button>

      <button
        class="secondary"
        onclick="adminReports()"
      >
        通報管理
      </button>

    </div>
  `;
}


async function adminUsers() {
  const {
    data
  } = await supabaseClient
    .from("users")
    .select(`
      id,
      username,
      role,
      created_at,
      ban_until
    `)
    .order("created_at", {
      ascending: false
    })
    .limit(200);

  $("adminContent").innerHTML = `
    <div class="admin">

      <h2>ユーザー管理</h2>

      <button
        class="secondary"
        onclick="loadAdmin()"
      >
        戻る
      </button>

      <div id="adminUserList"></div>

    </div>
  `;

  const box =
    $("adminUserList");

  for (const user of data || []) {
    box.innerHTML += `
      <div class="adminRow">

        <b>
          ${escapeHTML(
            user.username
          )}
        </b>

        <div class="handle">
          ID: ${user.id}
        </div>

        <div
          style="margin-top:8px"
        >

          <button
            class="secondary"
            onclick="
              adminChangeRole(
                '${user.id}'
              )
            "
          >
            権限変更
          </button>

          <button
            class="danger"
            onclick="
              adminBan(
                '${user.id}'
              )
            "
          >
            BAN
          </button>

          <button
            class="danger"
            onclick="
              adminDeleteUser(
                '${user.id}'
              )
            "
          >
            削除
          </button>

        </div>
      </div>
    `;
  }
}


async function adminChangeRole(userId) {
  const role =
    prompt(
      "権限を入力：admin または user"
    );

  if (
    role !== "admin" &&
    role !== "user"
  ) {
    return;
  }

  const {
    error
  } = await supabaseClient
    .from("users")
    .update({ role })
    .eq("id", userId);

  if (error) {
    toast("権限変更失敗");
    return;
  }

  toast("権限を変更しました");

  await adminUsers();
}


async function adminBan(userId) {
  const minutes =
    Number(
      prompt(
        "BAN時間（分）",
        "60"
      )
    );

  if (
    !minutes ||
    minutes < 1
  ) {
    return;
  }

  const until =
    new Date(
      Date.now() +
      minutes * 60 * 1000
    ).toISOString();

  const {
    error
  } = await supabaseClient
    .from("users")
    .update({
      ban_until: until
    })
    .eq("id", userId);

  if (error) {
    console.error(error);
    toast("BAN失敗");
    return;
  }

  toast("BANしました");
}


async function adminDeleteUser(userId) {
  if (
    !confirm(
      "このユーザーを削除しますか？"
    )
  ) {
    return;
  }

  const {
    error
  } = await supabaseClient
    .from("users")
    .delete()
    .eq("id", userId);

  if (error) {
    toast("削除失敗");
    console.error(error);
    return;
  }

  cache.users.delete(
    userId
  );

  toast("ユーザーを削除しました");

  await adminUsers();
}


async function adminPosts() {
  const {
    data
  } = await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      created_at
    `)
    .order("created_at", {
      ascending: false
    })
    .limit(200);

  const users =
    await getUsers(
      (data || []).map(
        post => post.user_id

    );

  const userMap =
    new Map(
      users.map(user => [
        user.id,

      ])
    );

  $("adminContent").innerHTML = `
    <div class="admin">

      <h2>投稿管理</h2>

      <button
        class="secondary"
        onclick="loadAdmin()"
      >
        戻る
      </button>

      <div id="adminPostList"></div>

    </div>
  `;

  const box =
    $("adminPostList");

  for (const post of data || []) {
    const user =
      userMap.get(
        post.user_id
      );

    box.innerHTML += `
      <div class="adminRow">

        <b>
          ${escapeHTML(
            user?.username || ""
          )}
        </b>

        <div>
          ${escapeHTML(
            post.content || ""
          )}
        </div>

        <button
          class="danger"
          onclick="
            adminDeletePost(

            )

        </button>

      </div>

async function adminDeletePost(postId) {
  if (
    !confirm(
      "この投稿を削除しますか？"
    )
  ) {
    return;
  }

  const {
    error
  } = await supabaseClient
    .from("posts")
    .delete()
    .eq("id", postId);

  if (error) {
    toast("削除失敗");
    return;
  }

  cache.posts.delete(
    postId
  );

  toast("削除しました");

  await adminPosts();
}


async function adminReports() {
  const {
    data
  } = await supabaseClient
    .from("reports")
    .select(`
      id,
      target_user_id,
      post_id,
      reason,
      status,
      created_at
    `)
    .eq(
      "status",
      "open"
    )
    .order("created_at", {
      ascending: false
    })
    .limit(100);

  const users =
    await getUsers(
      (data || []).map(
        report =>
          report.target_user_id
      )
    );

  const userMap =
    new Map(
      users.map(user => [
        user.id,
        user
      ])
    );

  $("adminContent").innerHTML = `
    <div class="admin">

      <h2>通報管理</h2>

      <button
        class="secondary"
        onclick="loadAdmin()"
      >
        戻る
      </button>

      <div id="adminReportList"></div>

    </div>
  `;

  const box =
    $("adminReportList");

  if (!data?.length) {
    box.innerHTML =
      `<div class="empty">
        未処理の通報はありません
      </div>`;

    return;
  }

  for (const report of data) {
    const user =
      userMap.get(
        report.target_user_id
      );

    box.innerHTML += `
      <div class="adminRow">

        <b>
          対象：
          ${escapeHTML(
            user?.username || "不明"
          )}
        </b>

        <div>
          ${escapeHTML(
            report.reason || ""
          )}
        </div>

        <div class="handle">
          ${formatDate(
            report.created_at
          )}
        </div>

        <button
          class="secondary"
          onclick="
            resolveReport(
              '${report.id}'
            )
          "
        >
          対応済み
        </button>

        <button
          class="danger"
          onclick="
            adminBan(
              '${report.target_user_id}'
            )
          "
        >
          BAN
        </button>

      </div>
    `;
  }
}


async function resolveReport(reportId) {
  await supabaseClient
    .from("reports")
    .update({
      status: "resolved"
    })
    .eq(
      "id",
      reportId
    );

  await adminReports();
}

async function showFollowingLatestPosts() {
  hidePages();

  $("notificationPage").classList.remove("hidden");

  const box = $("notifications");
  box.innerHTML = `<div class="empty">読み込み中...</div>`;

  // 自分がフォローしているユーザー
  const { data: follows, error: followsError } = await supabaseClient
    .from("follows")
    .select("following_id")
    .eq("follower_id", currentUser.id);

  if (followsError) {
    console.error(followsError);
    box.innerHTML = `<div class="empty">フォロー情報を取得できませんでした</div>`;
    return;
  }

  const followingIds = (follows || [])
    .map(row => row.following_id)
    .filter(Boolean);

  if (!followingIds.length) {
    box.innerHTML = `<div class="empty">まだ誰もフォローしていません</div>`;
    return;
  }

  // フォロー中ユーザーの最新10件
  const { data: posts, error: postsError } = await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      image_url,
      created_at
    `)
    .in("user_id", followingIds)
    .order("created_at", { ascending: false })
    .limit(10);

  if (postsError) {
    console.error(postsError);
    box.innerHTML = `<div class="empty">投稿を取得できませんでした</div>`;
    return;
  }

  if (!posts?.length) {
    box.innerHTML = `<div class="empty">フォローしている人の投稿はまだありません</div>`;
    return;
  }

  const users = await getUsers(
    posts.map(post => post.user_id)
  );

  const userMap = new Map(
    users.map(user => [user.id, user])
  );

  const meta = await getPostMeta(
    posts.map(post => post.id)
  );

  box.innerHTML = "";

  for (const post of posts) {
    const user = userMap.get(post.user_id);

    if (!user) continue;

    cache.posts.set(post.id, post);

    box.appendChild(
      createPostElement(post, user, meta)
    );
  }
}
