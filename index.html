

<!doctype html>
<html lang=ja>

<head>
    <meta charset=UTF-8>
    <meta name=viewport content="width=device-width,initial-scale=1">
    <title>chanpro-Post</title>
    <link rel=icon type=image/png
        href=https://qiita-image-store.s3.ap-northeast-1.amazonaws.com/0/4422522/6c28fb79-5ca6-4b57-afa1-9cd0bfa4aef8.png>
    <script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2></script>
    <script src=https://unpkg.com/mqtt/dist/mqtt.min.js></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f9fa;
            color: #0f1419
        }

        button,
        input,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .hidden {
            display: none !important
        }

        .app {
            display: grid;
            grid-template-columns: 260px minmax(0, 650px) 320px;
            max-width: 1250px;
            margin: auto;
            min-height: 100vh
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 20px;
            border-right: 1px solid #e1e8ed;
            background: #fff
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #1d9bf0;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .logo img {
            height: 50px;
            width: auto
        }

        @media (max-width:600px) {
            .logo span {
                display: none
            }
        }

        .nav button {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: 0 0;
            padding: 13px 15px;
            border-radius: 25px;
            margin: 4px 0;
            font-size: 16px
        }

        .nav button:hover {
            background: #eef7fd
        }

        .postButton {
            width: 100%;
            border: 0;
            background: #1d9bf0;
            color: #fff;
            padding: 13px;
            border-radius: 25px;
            font-weight: 700;
            margin-top: 20px
        }

        .main {
            min-width: 0;
            border-right: 1px solid #e1e8ed;
            background: #fff
        }

        .pageHeader {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            font-weight: 800
        }

        .composer {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .composer textarea {
            width: 100%;
            min-height: 90px;
            border: 0;
            outline: 0;
            resize: none;
            font-size: 18px
        }

        .composer input {
            width: 100%;
            border: 1px solid #cfd9de;
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px
        }

        .composerBottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px
        }

        .primary {
            background: #1d9bf0;
            color: #fff;
            border: 0;
            border-radius: 22px;
            padding: 9px 18px;
            font-weight: 700
        }

        .secondary {
            background: #fff;
            color: #0f1419;
            border: 1px solid #cfd9de;
            border-radius: 22px;
            padding: 8px 15px;
            font-weight: 700
        }

        .danger {
            background: #f4212e;
            color: #fff;
            border: 0;
            border-radius: 20px;
            padding: 8px 15px
        }

        .post {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            transition: .15s
        }

        .post:hover {
            background: #fafafa
        }

        .postHead {
            display: flex;
            gap: 10px
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd
        }

        .postUser {
            font-weight: 700
        }

        .handle {
            color: #536471;
            font-size: 14px
        }

        .postText {
            margin: 8px 0;
            white-space: pre-wrap;
            word-break: break-word;
            cursor: pointer
        }

        .postImage {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 15px;
            margin-top: 8px;
            border: 1px solid #e1e8ed
        }

        .postActions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #536471
        }

        .action {
            border: 0;
            background: 0 0;
            color: #536471;
            padding: 6px
        }

        .action:hover {
            color: #1d9bf0
        }

        .action.liked {
            color: #f91880
        }

        .action.reposted {
            color: #00ba7c
        }

        .rightbar {
            padding: 15px
        }

        .search {
            width: 100%;
            border: 0;
            background: #eff3f4;
            border-radius: 25px;
            padding: 12px 18px;
            outline: 0
        }

        .card {
            background: #f7f9f9;
            border-radius: 18px;
            padding: 15px;
            margin-top: 15px
        }

        .card h3 {
            margin-top: 0
        }

        .trend {
            padding: 9px 0;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer
        }

        .trend small {
            display: block;
            color: #536471
        }

        .userRow {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0
        }

        .userRowInfo {
            flex: 1
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px
        }

        .modalBox {
            background: #fff;
            border-radius: 18px;
            width: min(600px, 100%);
            max-height: 90vh;
            overflow: auto;
            padding: 20px
        }

        .modalBox input,
        .modalBox textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cfd9de;
            border-radius: 10px;
            margin: 7px 0
        }

        .profileCover {
            height: 180px;
            background: linear-gradient(135deg, #1d9bf0, #7856ff)
        }

        .profileInfo {
            padding: 15px
        }

        .profileBigAvatar {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-top: -55px
        }

        .profileActions {
            float: right;
            margin-top: 10px
        }

        .profileHandle {
            color: #536471
        }

        .profileBio {
            margin-top: 12px;
            white-space: pre-wrap
        }

        .profileStats {
            display: flex;
            gap: 25px;
            margin-top: 15px
        }

        .profileStats div {
            display: flex;
            flex-direction: column
        }

        .profileStats span {
            color: #536471;
            font-size: 13px
        }

        .notification {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .unread {
            background: #eef7fd
        }

        .dmList {
            border-bottom: 1px solid #e1e8ed
        }

        .dmUser {
            padding: 12px;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer
        }

        .dmMessages {
            height: 350px;
            overflow: auto;
            padding: 10px;
            background: #f7f9fa
        }

        .dmMessage {
            padding: 8px 12px;
            border-radius: 15px;
            background: #e8f1ff;
            margin: 5px;
            max-width: 75%
        }

        .dmMessage.me {
            margin-left: auto;
            background: #d9ffd9
        }

        .admin {
            padding: 15px
        }

        .adminRow {
            padding: 12px;
            border-bottom: 1px solid #e1e8ed
        }

        .empty {
            padding: 40px 20px;
            text-align: center;
            color: #536471
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f1419;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            z-index: 1000
        }

        @media(max-width:1000px) {
            .app {
                grid-template-columns: 80px minmax(0, 650px) 0
            }

            .rightbar {
                display: none
            }

            .logo {
                font-size: 0
            }

            .logo:after {
                content: "CP";
                font-size: 22px
            }

            .nav button {
                font-size: 0;
                text-align: center
            }

            .nav button:first-letter {
                font-size: 22px
            }
        }

        @media(max-width:650px) {
            .app {
                display: block
            }

            .sidebar {
                position: fixed;
                bottom: 0;
                top: auto;
                height: 60px;
                width: 100%;
                z-index: 50;
                padding: 5px;
                border-top: 1px solid #e1e8ed;
                border-right: 0
            }

            .logo,
            .postButton {
                display: none
            }

            .nav {
                display: flex;
                justify-content: space-around
            }

            .nav button {
                margin: 0;
                width: auto;
                padding: 10px
            }

            .main {
                padding-bottom: 60px
            }
        }

        .profileStatClickable {
            cursor: pointer
        }

        .profileStatClickable:hover b,
        .profileStatClickable:hover span {
            color: #1d9bf0
        }

        .profileCover {
            height: 180px;
            background-color: #1d9bf0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat
        }

        .detailBack {
            display: flex;
            align-items: center;
            gap: 15px
        }

        .detailBack button {
            font-size: 20px;
            padding: 4px 10px
        }

        .detailPostWrap {
            border-bottom: 1px solid #e1e8ed;
            padding: 15px
        }

        .detailPostText {
            font-size: 20px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 10px 0
        }

        .detailMeta {
            color: #536471;
            font-size: 14px;
            padding: 8px 0;
            border-top: 1px solid #e1e8ed;
            border-bottom: 1px solid #e1e8ed;
            margin-top: 10px
        }

        .detailComposer {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .detailComposer textarea {
            width: 100%;
            min-height: 80px;
            border: 0;
            outline: 0;
            resize: none;
            font-size: 17px;
            padding: 8px 0
        }

        .reply {
            padding: 12px 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .replyHead {
            display: flex;
            gap: 10px
        }

        .replyAvatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            cursor: pointer
        }

        .replyBody {
            flex: 1;
            min-width: 0
        }

        .replyUser {
            font-weight: 700;
            cursor: pointer
        }

        .replyText {
            margin: 4px 0;
            white-space: pre-wrap;
            word-break: break-word
        }

        .replyActions {
            display: flex;
            gap: 18px;
            margin-top: 6px;
            color: #536471;
            font-size: 13px
        }

        .replyActions button {
            border: 0;
            background: 0 0;
            color: #536471;
            padding: 4px 6px;
            border-radius: 14px
        }

        .replyActions button:hover {
            color: #1d9bf0;
            background: #eef7fd
        }

        .replyChildren {
            margin-left: 30px;
            border-left: 2px solid #e1e8ed;
            padding-left: 10px;
            margin-top: 8px
        }

        .replyComposerInline {
            padding: 10px;
            background: #f7f9fa;
            border-bottom: 1px solid #e1e8ed
        }

        .replyComposerInline textarea {
            width: 100%;
            min-height: 60px;
            border: 1px solid #cfd9de;
            border-radius: 12px;
            padding: 8px;
            outline: 0;
            resize: none
        }

        .replyToHint {
            color: #1d9bf0;
            font-size: 13px;
            margin-bottom: 4px
        }
        .navNotification {
          position: relative;
        }
        
        .notificationDot {
          position: absolute;
          top: 0;
          right: 0;
          width: 15px;
          height: 15px;
          background: #f4212e;
          border-radius: 50%;
          border: 2px solid #fff;
        }
        button img {
          width: 20px;
          height: 20px;
          object-fit: contain;
          vertical-align: middle;
          margin-right: 6px;
        }
/* ============================================================
   プロフィール音楽
   ============================================================ */

.profileMusicSection {
  margin-top: 18px;
  padding: 16px;
  border: 1px solid #e1e8ed;
  border-radius: 16px;
  background: #f8fafb;
}

.profileMusicHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.profileMusicTitle {
  font-size: 17px;
  font-weight: 800;
}

.profileMusicSub {
  color: #536471;
  font-size: 13px;
  margin-top: 3px;
}

.profileMusicEmpty {
  padding: 14px;
  text-align: center;
  color: #536471;
  background: #fff;
  border-radius: 12px;
  border: 1px dashed #cfd9de;
}

.profileMusicCard {
  background: #fff;
  border: 1px solid #e1e8ed;
  border-radius: 14px;
  padding: 14px;
}

.profileMusicInfo {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.profileMusicIcon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg,#1d9bf0,#7856ff);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.profileMusicName {
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.profileMusicSize {
  color: #536471;
  font-size: 12px;
  margin-top: 3px;
}

.profileMusicControls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.profileMusicPlayButton {
  flex: 1;
  border: 0;
  background: #1d9bf0;
  color: #fff;
  border-radius: 22px;
  padding: 9px 14px;
  font-weight: 700;
}

.profileMusicPlayButton:hover {
  background: #1688d8;
}

.profileMusicStopButton {
  border: 1px solid #cfd9de;
  background: #fff;
  color: #0f1419;
  border-radius: 22px;
  padding: 9px 14px;
  font-weight: 700;
}

.profileMusicDrop {
  margin-top: 10px;
  border: 2px dashed #cfd9de;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
  cursor: pointer;
  background: #fff;
  transition: .15s;
}

.profileMusicDrop:hover {
  border-color: #1d9bf0;
  background: #f7fbff;
}

.profileMusicDrop.dragover {
  border-color: #1d9bf0;
  background: #eef7fd;
}

.profileMusicDrop strong {
  display: block;
  margin-bottom: 5px;
}

.profileMusicDrop small {
  color: #536471;
}

.profileMusicProgressWrap {
  margin-top: 12px;
  display: none;
}

.profileMusicProgressWrap.show {
  display: block;
}

.profileMusicProgress {
  width: 100%;
  height: 8px;
  background: #e1e8ed;
  border-radius: 99px;
  overflow: hidden;
}

.profileMusicProgressBar {
  width: 0%;
  height: 100%;
  background: #1d9bf0;
  transition: width .15s;
}

.profileMusicProgressText {
  margin-top: 5px;
  font-size: 12px;
  color: #536471;
  text-align: center;
}

.profileMusicFileInput {
  display: none;
}

.profileMusicDanger {
  border: 1px solid #f4212e;
  background: #fff;
  color: #f4212e;
  border-radius: 22px;
  padding: 8px 13px;
  font-weight: 700;
}

.profileMusicDanger:hover {
  background: #fff1f2;
}

.profileMusicModalInfo {
  padding: 10px 12px;
  background: #f7f9fa;
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 13px;
  color: #536471;
}

.profileMusicCurrent {
  margin-bottom: 12px;
}

.profileMusicCurrentLabel {
  font-size: 12px;
  color: #536471;
  margin-bottom: 5px;
}

.profileMusicUploadLabel {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-top: 12px;
}
    </style>
</head>

<body>
    <div id=loginPage>
        <div
            style="max-width:420px;margin:80px auto;padding:25px;background:#fff;border-radius:20px;box-shadow:0 5px 30px rgba(0,0,0,.08)">
            <h1 style=color:#1d9bf0>chanpro-Post</h1>
            <p>chanpro-Chat と共通アカウント</p>
            <input id=loginName placeholder=ユーザー名 style="width:100%;padding:12px;margin:5px 0">
            <input id=loginPassword type=password placeholder=パスワード style="width:100%;padding:12px;margin:5px 0">
            <button class=primary style=width:100%;margin-top:10px onclick=login()>ログイン</button>
            <button class=secondary style=width:100%;margin-top:8px onclick=createAccount()>新規アカウント作成</button>
            <div id=loginError style=color:#f4212e;margin-top:10px></div>
        </div>
    </div>
    <div id=app class="app hidden">
        <aside class=sidebar>
            <div class=logo>
                <img src=https://qiita-image-store.s3.ap-northeast-1.amazonaws.com/0/4422522/6c28fb79-5ca6-4b57-afa1-9cd0bfa4aef8.png
                    alt="">
                <span>chanpro-Post</span>
            </div>
            <div class=nav>
                <button onclick='showPage("home")'>
                  <img src="https://img.icons8.com/?size=96&id=TzMnSwiJW8HO&format=png" alt="ホーム"> ホーム
                </button>
                
                <button onclick='showPage("search")'>
                  <img src="https://img.icons8.com/?size=96&id=12773&format=png" alt="検索"> 検索
                </button>
                
                <button id="notificationNav" class="navNotification" onclick='showPage("notifications")'>
                  <img src="https://img.icons8.com/?size=80&id=41913&format=png" alt="通知"> 通知
                  <span id="notificationDot" class="notificationDot hidden"></span>
                </button>
                
                <button onclick='showFollowingLatestPosts()'>
                  <img src="https://img.icons8.com/?size=160&id=fqKHVbd4GWbD&format=png" alt="フォロー中"> フォロー中
                </button>
                
                <button onclick='showPage("messages")'>
                  <img src="https://img.icons8.com/?size=160&id=bz2nLhYZWgCb&format=png" alt="DM"> DM
                </button>
                
                <button onclick='showMyProfile()'>
                  <img src="https://img.icons8.com/?size=96&id=IerOpHeUt2OH&format=png" alt="プロフィール"> プロフィール
                </button>
                
                <button onclick='showBookmarks()'>
                  <img src="https://img.icons8.com/?size=160&id=42404&format=png" alt="ブックマーク"> ブックマーク
                </button>
                
                <button id="adminNav" class="hidden" onclick='showPage("admin")'>
                  <img src="https://img.icons8.com/?size=96&id=szJmuYXfPSIN&format=png" alt="管理"> 管理
                </button>

            </div>
            <button class=postButton onclick=openPostModal()>投稿</button>
            <button class=secondary style=width:100%;margin-top:10px onclick=logout()>ログアウト</button>
        </aside>
        <main class=main>
            <div id=homePage>
                <div class=pageHeader>ホーム</div>
                <div class=composer>
                    <textarea id=quickPostText placeholder=いまどうしてる？></textarea>
                    <input id=quickPostImage placeholder=画像URL（任意）>
                    <button id=quickLimitedToggle class="secondary hidden" style="margin-top:8px;width:100%"
                        onclick="toggleQuickLimited()">一般公開</button>
                    <div class=composerBottom>
                        <span>#ハッシュタグ対応</span>
                        <button class=primary onclick=quickPost()>投稿</button>
                    </div>
                </div>
                <div id=homePosts></div>
            </div>
            <div id=searchPage class=hidden>
                <div class=pageHeader>検索</div>
                <div style=padding:15px>
                    <input id=searchInput class=search placeholder=ユーザー・投稿・#ハッシュタグ
                        onkeydown='"Enter"===event.key&&searchAll(this.value)'>
                </div>
                <div id=searchResults></div>
            </div>
            <div id=notificationPage class=hidden>
                <div class=pageHeader>通知</div>
                <div id=notifications></div>
            </div>
            <div id=messagesPage class=hidden>
                <div class=pageHeader>DM</div>
                <div id=dmContent></div>
            </div>
            <div id=profilePage class=hidden></div>
            <div id=bookmarksPage class=hidden>
                <div class=pageHeader>ブックマーク</div>
                <div id=bookmarkPosts></div>
            </div>
            <div id=detailPage class=hidden>
                <div class="pageHeader detailBack">
                    <button class=secondary onclick='showPage("home")'>←</button>
                    <span>投稿</span>
                </div>
                <div id=detailContent></div>
            </div>
            <div id=adminPage class=hidden>
                <div class=pageHeader>管理者</div>
                <div id=adminContent></div>
            </div>
        </main>
        <aside class=rightbar>
            <div class=card>
                <h3>トレンド</h3>
                <div id=trends></div>
            </div>
            <div class=card>
                <h3>おすすめユーザー</h3>
                <div id=suggestedUsers></div>
            </div>
        </aside>
    </div>
    <div id=modal class="modal hidden" onclick="event.target===this&&closeModal()">
        <div class=modalBox id=modalContent></div>
    </div>
    <div id=toast class="toast hidden"></div>
<script>
// ============================================================
// プロフィール音楽設定
// ============================================================

const PROFILE_MUSIC_MAX_SIZE = 2 * 1024 * 1024; // 2MB
const PROFILE_MUSIC_CHUNK_SIZE = 32 * 1024;     // 32KB
const PROFILE_MUSIC_MAX_CHUNKS =
  Math.ceil(PROFILE_MUSIC_MAX_SIZE / PROFILE_MUSIC_CHUNK_SIZE);

const PROFILE_MUSIC_ALLOWED_TYPES = [

    const visibleRepostPosts = canSeeLimited()
      ? repostPosts
      : repostPosts.filter(

function mqttTopicUser(e) {
  return `chanpro-post/user/${e}`;
}
function mqttTopicGlobal() {
  return "chanpro-post/global";
}
function connectMQTT() {
  if (!currentUser) return;
  if (mqttClient) {
    try {
      mqttClient.end(!0);
    } catch {}
    mqttClient = null;
  }
  const e = `chanpro-post-${currentUser.id}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  ((mqttClient = mqtt.connect(MQTT_BROKER, {
    clientId: e,
    clean: !0,
    reconnectPeriod: 3e3,
    connectTimeout: 1e4,
  })),
    mqttClient.on("connect", () => {
      (console.log("MQTT接続成功"),
        mqttClient.subscribe(mqttTopicUser(currentUser.id), { qos: 0 }, (e) => {
          e && console.error("MQTT subscribe user:", e);
        }),
        mqttClient.subscribe(mqttTopicGlobal(), { qos: 0 }, (e) => {
          e && console.error("MQTT subscribe global:", e);
        }));
    }),
    mqttClient.on("reconnect", () => {
      console.log("MQTT再接続中...");
    }),
    mqttClient.on("error", (e) => {
      console.error("MQTT error:", e);
    }),
    mqttClient.on("offline", () => {
      console.log("MQTT offline");
    }),
    mqttClient.on("message", async (e, t) => {
      try {
        const e = JSON.parse(t.toString());
        await handleMQTTEvent(e);
      } catch (e) {
        console.error("MQTT message error:", e);
      }
    }));
}
function mqttPublish(e, t) {
  mqttClient &&
    (mqttClient.connected
      ? mqttClient.publish(e, JSON.stringify(t), { qos: 0, retain: !1 })
      : console.log("MQTT未接続のため送信をスキップ"));
}
async function handleMQTTEvent(e) {
  if (currentUser) {
    if(e.type === "notification_created"){
      setNotificationDot(true);
      return;
    }      
    if ("message" !== e.type)
      return "post_created" === e.type
        ? ($("homePage").classList.contains("hidden") || (await loadHome()),
          void (
            !$("detailPage").classList.contains("hidden") &&
            currentDetailPost &&
            currentDetailPost.id === e.post_id &&
            (await renderDetailReplies(currentDetailPost.id))
          ))
        : "post_deleted" === e.type
          ? (cache.posts.delete(e.post_id),
            void (
              $("homePage").classList.contains("hidden") || (await loadHome())
            ))
          : "follow" === e.type
            ? ((cache.suggestedUsers = null),
              void (
                $("profilePage").classList.contains("hidden") ||
                (await showUserProfile(currentUser.id))
              ))
            : void (
                ("like" !== e.type && "repost" !== e.type) ||
                $("homePage").classList.contains("hidden") ||
                (await loadHome())

    if (!e.message_id) return;
    if (e.sender_id === currentUser.id) return;
    if (e.receiver_id !== currentUser.id) return;
    if (currentDMUser && currentDMUser.id === e.sender_id && $("dmMessages")) {
      const { data: t, error: n } = await supabaseClient
        .from("messages")
        .select("id, sender_id, receiver_id, content, created_at")

      appendDMMessage(t);

      (s && (s.scrollTop = s.scrollHeight), toast("新しいDM"));

      currentDMUser ||
      (await loadDMs());
  }
}

async function sendDM() {

  const e = $("dmInput");
  const t = e.value.trim();

  if (!t) return;

  const { data: n, error: s } = await supabaseClient
    .from("messages")

    type: "message",
    message_id: n.id,
    sender_id: currentUser.id,
    receiver_id: currentDMUser.id,

      .from("notifications")
      .insert({
        user_id: currentDMUser.id,
        actor_id: currentUser.id,
        type: "message",
        message_id: n.id,
      });

    if (notificationError) {
      console.error(notificationError);
    } else {

        type: "notification_created",

async function adminBan(userId) {
  // 管理者チェック
  if (currentUser?.role !== "admin") {
    return void toast("管理者権限が必要です");
  }

  // ユーザーIDチェック
  if (!userId) {
    return void toast("ユーザーIDがありません");
  }

  // BAN時間入力
  const input = prompt("BAN時間（分）", "60");

  if (input === null) return;

  const minutes = Number(input);

  if (!Number.isFinite(minutes) || minutes < 1) {
    return void toast("BAN時間が正しくありません");
  }

  // BAN対象ユーザー取得
  const { data: user, error: userError } = await supabaseClient
    .from("users")
    .select("id, username")
    .eq("id", userId)
    .maybeSingle();

  if (userError) {
    console.error("BAN対象ユーザー取得:", userError);
    return void toast("ユーザー情報を取得できませんでした");
  }

  if (!user) {
    return void toast("ユーザーが見つかりません");
  }

  // BAN終了時刻
  const banUntil = new Date(
    Date.now() + 60 * minutes * 1000
  ).toISOString();

  // アカウントBAN
  const { error: banError } = await supabaseClient
    .from("users")
    .update({
      ban_until: banUntil,
    })
    .eq("id", userId);

  if (banError) {
    console.error("アカウントBAN:", banError);
    return void toast("BANに失敗しました");
  }

  // BAN対象ユーザーの端末情報を取得
  const { data: devices, error: deviceError } = await supabaseClient
    .from("user_devices")
    .select("device_hash, device_info")
    .eq("user_id", userId);

  if (deviceError) {
    console.error("ユーザー端末取得:", deviceError);
  }

  // device_hash単位で重複排除
  const uniqueDevices = [
    ...new Map(
      (devices || [])
        .filter((device) => device.device_hash)
        .map((device) => [
          device.device_hash,
          device,
        ])
    ).values(),
  ];

  // 端末BAN
  if (uniqueDevices.length) {
    const bannedDevices = uniqueDevices.map((device) => ({
      device_hash: device.device_hash,
      device_info: device.device_info ?? null,
      reason: `ユーザー「${user.username}」のBANに伴う端末BAN`,
      banned_by: currentUser.id,
    }));

    const { error: deviceBanError } = await supabaseClient
      .from("banned_devices")
      .upsert(bannedDevices, {
        onConflict: "device_hash",
      });

    if (deviceBanError) {
      console.error("端末BAN:", deviceBanError);

      toast(
        "アカウントをBANしましたが、端末BANの登録に失敗しました"
      );

      await adminUsers();
      return;
    }
  }

  // キャッシュから削除
  cache.users.delete(userId);

  // 自分自身をBANした場合
  if (userId === currentUser.id) {
    currentUser = null;

    safeRemove("chanpro_post_user");

    // MQTT切断
    if (mqttClient) {
      try {
        mqttClient.end(true);
      } catch {}

      mqttClient = null;
    }

    // DMチャンネル削除
    if (dmChannel) {
      try {
        await supabaseClient.removeChannel(dmChannel);
      } catch {}

      dmChannel = null;
    }

    // BAN反映のためリロード
    location.reload();
    return;
  }

  // 他ユーザーをBANした場合
  toast(`${user.username} を ${minutes}分BANしました`);

  await adminUsers();
}

async function mqttPublishRaw(topic, payload, retain = true) {
  if (!mqttClient) {
    throw new Error("MQTT接続がありません");
  }

  if (!mqttClient.connected) {
    throw new Error("MQTTに接続されていません");
  }

  return new Promise((resolve, reject) => {
    mqttClient.publish(
      topic,
      payload,
      {
        qos: 1,
        retain: retain
      },
      (error) => {
        if (error) {
          reject(error);
          return;
        }

        resolve();
      }
    );
  });
}
function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);

  let binary = "";

  const sliceSize = 0x8000;

  for (let i = 0; i < bytes.length; i += sliceSize) {
    const slice = bytes.subarray(
      i,
      Math.min(i + sliceSize, bytes.length)
    );

    binary += String.fromCharCode(...slice);
  }

  return btoa(binary);
}
function base64ToArrayBuffer(base64) {
  const binary = atob(base64);

  const buffer = new ArrayBuffer(binary.length);
  const bytes = new Uint8Array(buffer);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return buffer;
}
function formatProfileMusicSize(size) {

    return `${(size / 1024).toFixed(1)} KB`;
  }

  return `${(size / 1024 / 1024).toFixed(2)} MB`;
}

async function uploadProfileMusic(file) {
  if (!currentUser) {
    throw new Error("ログインしてください");
  }

  if (!(file instanceof File)) {
    throw new Error("音楽ファイルを選択してください");
  }

  // ----------------------------------------------------------
  // ファイル形式チェック
  // ----------------------------------------------------------

  const extension =
    file.name.split(".").pop().toLowerCase();

  const allowedExtensions = [
    "mp3",
    "wav"
  ];

  if (!allowedExtensions.includes(extension)) {
    throw new Error(
      "対応形式はMP3またはWAVです"
    );
  }

  if (
    file.type &&
    !PROFILE_MUSIC_ALLOWED_TYPES.includes(file.type)
  ) {
    if (extension !== "mp3" && extension !== "wav") {
      throw new Error(
        "MP3またはWAVファイルを選択してください"
      );
    }
  }

  // ----------------------------------------------------------
  // サイズチェック
  // ----------------------------------------------------------

  if (file.size <= 0) {
    throw new Error("空の音楽ファイルです");
  }

  if (file.size > PROFILE_MUSIC_MAX_SIZE) {
    throw new Error(
      `音楽ファイルは最大${formatProfileMusicSize(PROFILE_MUSIC_MAX_SIZE)}です`
    );
  }

  // ----------------------------------------------------------
  // 現在の音楽
  // ----------------------------------------------------------

  const oldMusic =
    currentUser.profile_music || null;

  const musicId =
    createProfileMusicId();

  const buffer =
    await file.arrayBuffer();

  const bytes =
    new Uint8Array(buffer);

  const totalChunks =
    Math.ceil(
      bytes.length /
      PROFILE_MUSIC_CHUNK_SIZE
    );

  if (totalChunks > PROFILE_MUSIC_MAX_CHUNKS) {
    throw new Error(
      "音楽ファイルの分割数が上限を超えています"
    );
  }

  // ----------------------------------------------------------
  // アップロード表示
  // ----------------------------------------------------------

  setProfileMusicUploadProgress(
    0,
    "音楽ファイルを準備しています..."
  );

  try {

    // --------------------------------------------------------
    // 新しい音楽を先にMQTTへ保存
    // --------------------------------------------------------

    for (
      let index = 0;
      index < totalChunks;
      index++
    ) {
      const start =
        index * PROFILE_MUSIC_CHUNK_SIZE;

      const end =
        Math.min(
          start + PROFILE_MUSIC_CHUNK_SIZE,
          bytes.length
        );

      const chunk =
        bytes.slice(start, end);

      const base64 =
        arrayBufferToBase64(chunk.buffer);

      const payload =
        JSON.stringify({
          type: "profile_music_chunk",
          music_id: musicId,
          index: index,
          total: totalChunks,
          data: base64
        });

      const topic =
        getProfileMusicTopic(
          currentUser.id,
          musicId,
          "chunk",
          index
        );

      await mqttPublishRaw(
        topic,
        payload,
        true
      );

      const percent =
        Math.round(
          ((index + 1) / totalChunks) * 90
        );

      setProfileMusicUploadProgress(
        percent,
        `音楽データを保存中... ${index + 1}/${totalChunks}`
      );
    }

    // --------------------------------------------------------
    // メタ情報
    // --------------------------------------------------------

    const musicMetadata = {
      music_id: musicId,
      name: file.name,
      mime:
        file.type ||
        (
          extension === "mp3"
            ? "audio/mpeg"
            : "audio/wav"
        ),
      size: file.size,
      chunks: totalChunks,
      created_at:
        new Date().toISOString()
    };

    const metaTopic =
      getProfileMusicTopic(
        currentUser.id,
        musicId,
        "meta"
      );

    await mqttPublishRaw(
      metaTopic,
      JSON.stringify({
        type: "profile_music_meta",
        ...musicMetadata
      }),
      true
    );

    setProfileMusicUploadProgress(
      95,
      "プロフィールを更新しています..."
    );

    // --------------------------------------------------------
    // Supabase
    // --------------------------------------------------------

    const { error } =
      await supabaseClient
        .from("users")
        .update({
          profile_music: musicMetadata
        })
        .eq("id", currentUser.id);

    if (error) {
      // Supabase更新失敗時は新しく保存したMQTTを削除
      try {
        await clearProfileMusicRetain(
          currentUser.id,
          musicMetadata
        );
      } catch (cleanupError) {
        console.error(
          "MQTT cleanup error:",
          cleanupError
        );
      }

      throw error;
    }

    // --------------------------------------------------------
    // 古い音楽を削除
    // --------------------------------------------------------

    if (
      oldMusic &&
      oldMusic.music_id &&
      oldMusic.music_id !== musicId
    ) {
      try {
        await clearProfileMusicRetain(
          currentUser.id,
          oldMusic
        );
      } catch (cleanupError) {
        console.error(
          "古い音楽の削除に失敗:",
          cleanupError
        );
      }
    }

    // --------------------------------------------------------
    // 現在ユーザー更新
    // --------------------------------------------------------

    currentUser.profile_music =
      musicMetadata;

    setProfileMusicUploadProgress(
      100,
      "アップロード完了"
    );

    await new Promise(resolve =>
      setTimeout(resolve, 500)
    );

    return musicMetadata;

  } finally {
    hideProfileMusicUploadProgress();
  }
}
function setProfileMusicUploadProgress(percent, text) {
  const wrap =
    document.getElementById(
      "profileMusicProgressWrap"
    );

  const bar =
    document.getElementById(
      "profileMusicProgressBar"
    );

  const label =
    document.getElementById(
      "profileMusicProgressText"
    );

  if (!wrap || !bar || !label) {
    return;
  }

  wrap.classList.add("show");

  bar.style.width =
    `${Math.max(0, Math.min(100, percent))}%`;

  label.textContent =
    text || `${percent}%`;
}
function hideProfileMusicUploadProgress() {
  const wrap =
    document.getElementById(
      "profileMusicProgressWrap"
    );

  const bar =
    document.getElementById(
      "profileMusicProgressBar"
    );

  const label =
    document.getElementById(
      "profileMusicProgressText"
    );

  if (!wrap) {
    return;
  }

  setTimeout(() => {
    wrap.classList.remove("show");

    if (bar) {
      bar.style.width = "0%";
    }

    if (label) {
      label.textContent = "";
    }
  }, 700);
}
async function getProfileMusic(userId, music) {
  if (
    !userId ||
    !music ||
    !music.music_id
  ) {
    throw new Error("音楽情報がありません");
  }

  const musicId =
    music.music_id;

  const totalChunks =
    Number(music.chunks);

  if (
    !Number.isInteger(totalChunks) ||
    totalChunks <= 0
  ) {
    throw new Error(
      "音楽チャンク情報が不正です"
    );
  }

  if (
    totalChunks > PROFILE_MUSIC_MAX_CHUNKS
  ) {
    throw new Error(
      "音楽チャンク数が上限を超えています"
    );
  }

  const chunks =
    new Array(totalChunks);

  const topics = [];

  for (
    let index = 0;
    index < totalChunks;
    index++
  ) {
    topics.push({
      index,
      topic:
        getProfileMusicTopic(
          userId,
          musicId,
          "chunk",
          index
        )
    });
  }

  return new Promise((resolve, reject) => {

    const timeout =
      setTimeout(() => {
        cleanup();

        reject(
          new Error(
            "音楽データの取得がタイムアウトしました"
          )
        );
      }, 30000);

    const handlers = [];

    function cleanup() {
      clearTimeout(timeout);

      for (const handler of handlers) {
        mqttClient.removeListener(
          "message",
          handler
        );
      }

      for (const item of topics) {
        mqttClient.unsubscribe(
          item.topic,
          () => {}
        );
      }
    }

    let received = 0;

    for (const item of topics) {

      mqttClient.subscribe(
        item.topic,
        {
          qos: 1
        },
        (error) => {
          if (error) {
            cleanup();
            reject(error);
          }
        }
      );
    }

    const messageHandler =
      (topic, payload) => {

        const target =
          topics.find(
            item => item.topic === topic
          );

        if (!target) {
          return;
        }

        try {

          const data =
            JSON.parse(
              payload.toString()
            );

          if (
            data.type !==
            "profile_music_chunk"
          ) {
            return;
          }

          if (
            data.music_id !== musicId
          ) {
            return;
          }

          if (
            data.index !== target.index
          ) {
            return;
          }

          if (
            chunks[target.index]
          ) {
            return;
          }

          chunks[target.index] =
            data.data;

          received++;

          if (
            received >= totalChunks
          ) {
            cleanup();

            const buffers =
              chunks.map(
                chunk =>
                  base64ToArrayBuffer(chunk)
              );

            const totalLength =
              buffers.reduce(
                (sum, buffer) =>
                  sum + buffer.byteLength,
                0
              );

            const result =
              new Uint8Array(
                totalLength
              );

            let offset = 0;

            for (const buffer of buffers) {
              result.set(
                new Uint8Array(buffer),
                offset
              );

              offset +=
                buffer.byteLength;
            }

            resolve(
              result.buffer
            );
          }

        } catch (error) {
          cleanup();
          reject(error);
        }
      };

    handlers.push(messageHandler);

    mqttClient.on(
      "message",
      messageHandler
    );
  });
}
async function playProfileMusic(userId, music) {
  try {

    if (!userId || !music) {
      throw new Error(
        "音楽情報がありません"
      );
    }

    stopProfileMusic();

    showToast(
      "🎵 音楽を読み込んでいます..."
    );

    const buffer =
      await getProfileMusic(
        userId,
        music
      );

    const blob =
      new Blob(
        [buffer],
        {
          type:
            music.mime ||
            "audio/mpeg"
        }
      );

    if (profileMusicObjectUrl) {
      URL.revokeObjectURL(
        profileMusicObjectUrl
      );
    }

    profileMusicObjectUrl =
      URL.createObjectURL(blob);

    profileMusicAudio =
      new Audio(
        profileMusicObjectUrl
      );

    profileMusicAudio.preload =
      "auto";

    profileMusicAudio.onended =
      () => {
        updateProfileMusicPlayButtons(
          false
        );
      };

    await profileMusicAudio.play();

    updateProfileMusicPlayButtons(
      true
    );

    showToast(
      `▶ ${music.name}`
    );

  } catch (error) {

    console.error(
      "プロフィール音楽再生エラー:",
      error
    );

    updateProfileMusicPlayButtons(
      false
    );

    showToast(
      "音楽を再生できませんでした"
    );
  }
}
function stopProfileMusic() {
  if (profileMusicAudio) {
    try {
      profileMusicAudio.pause();
      profileMusicAudio.currentTime = 0;
    } catch (error) {
      console.error(error);
    }

    profileMusicAudio = null;
  }

  if (profileMusicObjectUrl) {
    URL.revokeObjectURL(
      profileMusicObjectUrl
    );

    profileMusicObjectUrl = null;
  }

  updateProfileMusicPlayButtons(
    false
  );
}
function updateProfileMusicPlayButtons(isPlaying) {
  document
    .querySelectorAll(
      ".profileMusicPlayButton"
    )
    .forEach(button => {

      button.textContent =
        isPlaying
          ? "⏸ 再生中"
          : "▶ 再生";

    });
}
async function deleteProfileMusic() {
  if (!currentUser) {
    showToast("ログインしてください");
    return;
  }

  const music =
    currentUser.profile_music;

  if (!music || !music.music_id) {
    showToast(
      "プロフィール音楽がありません"
    );
    return;
  }

  const confirmed =
    confirm(
      `「${music.name}」を削除しますか？`
    );

  if (!confirmed) {
    return;
  }

  try {

    stopProfileMusic();

    showToast(
      "音楽を削除しています..."
    );

    // MQTT Retain削除
    await clearProfileMusicRetain(
      currentUser.id,
      music
    );

    // Supabaseメタ情報削除
    const { error } =
      await supabaseClient
        .from("users")
        .update({
          profile_music: null
        })
        .eq("id", currentUser.id);

    if (error) {
      throw error;
    }

    currentUser.profile_music =
      null;

    showToast(
      "音楽を削除しました"
    );

    closeModal();

    await showMyProfile();

  } catch (error) {

    console.error(
      "プロフィール音楽削除エラー:",
      error
    );

    showToast(
      "音楽の削除に失敗しました"
    );
  }
}
async function handleProfileMusicSelect(file) {
  if (!file) {
    return;
  }

  try {

    await uploadProfileMusic(file);

    showToast(
      "🎵 プロフィール音楽を設定しました"
    );

    await showMyProfile();

  } catch (error) {

    console.error(
      "音楽アップロードエラー:",
      error
    );

    showToast(
      error.message ||
      "音楽のアップロードに失敗しました"
    );
  }
}
function openProfileMusicFilePicker() {
  const input =
    document.getElementById(
      "profileMusicFileInput"
    );

  if (!input) {
    return;
  }

  input.value = "";

  input.click();
}
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function setupProfileMusicDropZone() {
  const drop =
    document.getElementById(
      "profileMusicDrop"
    );

  if (!drop) {
    return;
  }

  drop.addEventListener(
    "dragover",
    event => {
      event.preventDefault();

      drop.classList.add(
        "dragover"
      );
    }
  );

  drop.addEventListener(
    "dragleave",
    () => {
      drop.classList.remove(
        "dragover"
      );
    }
  );

  drop.addEventListener(
    "drop",
    async event => {

      event.preventDefault();

      drop.classList.remove(
        "dragover"
      );

      const file =
        event.dataTransfer.files[0];

      if (!file) {
        return;
      }

      await handleProfileMusicSelect(
        file
      );
    }
  );
}
function showToast(message) {
  const toast =
    document.getElementById("toast");

  if (!toast) {
    alert(message);
    return;
  }

  toast.textContent =
    message;

  toast.classList.remove(
    "hidden"
  );

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(() => {
      toast.classList.add(
        "hidden"
      );
    }, 3000);
}

restoreLogin();
